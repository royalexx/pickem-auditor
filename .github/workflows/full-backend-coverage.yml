name: Full 31-market Bayesian sampler comparison (shadow only)
on:
  push:
    branches: ['bench/all-31-backends-20261029']
    paths:
      - 'scripts/full_backend_eval.py'
      - 'scripts/benchmark_bayes_backends.py'
      - '.github/workflows/full-backend-coverage.yml'
  workflow_dispatch:
    inputs:
      draws:
        description: "Post-warmup samples per chain"
        default: '500'
        type: string
      tune:
        description: "Adaptation samples per chain"
        default: '700'
        type: string
      replicates:
        description: "Independent research seeds"
        default: '2'
        type: string
permissions:
  contents: read
concurrency:
  group: full-bayes-backend-coverage
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      ready_count: ${{ steps.plan.outputs.ready_count }}
      history_sha: ${{ steps.plan.outputs.history_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load source-owned immutable historical warehouse
        run: bash scripts/history_warehouse_store.sh load
      - name: Audit every supported NHL NBA NFL market without training
        id: plan
        run: |
          python scripts/full_backend_eval.py --plan \
            --plan-file reports/full_backend_preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-bayes-31-market-source-preflight
          path: reports/full_backend_preflight.json
          retention-days: 90
  fit:
    needs: preflight
    if: needs.preflight.outputs.ready_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        backend: [pymc, nutpie, cmdstanpy]
        market: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    name: ${{ matrix.market }} / ${{ matrix.backend }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load EXACT historical snapshot audited by preflight
        env:
          FROZEN_SHA: ${{ needs.preflight.outputs.history_sha }}
        run: |
          git fetch --quiet origin refs/heads/data/bayesian-history:refs/remotes/origin/data/bayesian-history
          git cat-file -e "$FROZEN_SHA^{commit}" || exit 2
          mkdir -p data/bayesian_warehouse
          git archive "$FROZEN_SHA" data/bayesian_warehouse | tar -x
          echo "Historical training snapshot pinned to $FROZEN_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: full-bayes-31-market-source-preflight
          path: reports
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-joint-bayes.txt
      - name: Install independent statistical sampler
        run: |
          python -m pip install -r requirements-joint-bayes.txt
          if [ "${{ matrix.backend }}" = nutpie ]; then
            python -m pip install 'nutpie==0.16.11'
          elif [ "${{ matrix.backend }}" = cmdstanpy ]; then
            python -m pip install 'cmdstanpy==1.3.0'
            python -c 'import cmdstanpy; assert cmdstanpy.install_cmdstan(version="2.40.0",cores=2,progress=False)'
          fi
      - name: Two seeded 4-chain NUTS fits with identical source input
        id: evaluation
        continue-on-error: true
        env:
          DRAWS: ${{ inputs.draws || '500' }}
          TUNE: ${{ inputs.tune || '700' }}
          REPLICATES: ${{ inputs.replicates || '2' }}
        run: |
          python scripts/full_backend_eval.py \
            --market "${{ matrix.market }}" --backend "${{ matrix.backend }}" \
            --draws "$DRAWS" --tune "$TUNE" --chains 4 \
            --replicates "$REPLICATES" \
            --plan-file reports/full_backend_preflight.json \
            --out "reports/fit_${{ matrix.market }}_${{ matrix.backend }}.json"
      - name: Preserve fit and any diagnostic failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-bayes-${{ matrix.market }}-${{ matrix.backend }}
          path: reports/fit_${{ matrix.market }}_${{ matrix.backend }}.json
          retention-days: 90
          if-no-files-found: warn
      - name: Make incomplete evaluations visible
        if: always()
        env:
          RESULT: ${{ steps.evaluation.outcome }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "BACKEND_RESEARCH_FIT_INCOMPLETE ${{ matrix.market }} ${{ matrix.backend }}" >&2
            exit 2
          fi

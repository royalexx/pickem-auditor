name: One-off NBA repaired made-threes higher-effort NUTS convergence retest
on:
  push:
    branches: ['audit/multisport-joint-vs-poisson-20261028']
    paths: ['.github/workflows/audit-nba-threes-higheffort.yml']
permissions:
  contents: read
jobs:
  nba-threes-higher-mcmc:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-joint-bayes.txt
      - run: bash scripts/history_warehouse_store.sh load
      - run: python -m pip install -r requirements-joint-bayes.txt
      - name: Retest original NBA 3PM pre-cutoff roster with more NUTS draws and tuning
        run: |
          python scripts/audit_joint_population.py \
            --sport NBA --stat threes \
            --cutoff 2018-11-02 --until 2018-11-20 \
            --max-per-position 18 --line 2.5 \
            --draws 2000 --tune 1600 \
            --out reports/multisport_audit/nba_threes_retest
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-3pm-nuts-deeper-sampling-audit
          retention-days: 90
          if-no-files-found: warn
          path: reports/multisport_audit/nba_threes_retest/*.json

name: NHL history collection (manual fallback)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official NHL game boxscores
        run: python scripts/nhl_collect.py --days 2
      - name: Commit completed NHL histories
        run: |
          git config user.name pickem-auditor-bot
          git config user.email pickem-auditor-bot@users.noreply.github.com
          git add data/nhl/games/ || true
          if ! git diff --cached --quiet; then
            git commit -m 'data: completed NHL histories'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload collection receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nhl-collection-receipt
          path: reports/nhl_collection_receipt.json

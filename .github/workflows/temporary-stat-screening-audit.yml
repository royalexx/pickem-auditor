name: Temporary 2026-10-28 all-stat screening audit
on:
  push:
    branches: [audit/stat-screening-20261028]
    paths: [.github/workflows/temporary-stat-screening-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore actual latest forecasts and report true per-stat loss
        run: |
          git fetch --depth=1 origin data/shadow-calibration
          git show FETCH_HEAD:data/prop_snapshots.jsonl > /tmp/pickem_snapshot_audit.jsonl
          python - <<'PY'
          import sys,json,collections
          from datetime import datetime,timezone
          sys.path.insert(0,"scripts")
          import research_triage as tr
          data=[json.loads(s) for s in open("/tmp/pickem_snapshot_audit.jsonl") if s.strip()]
          batch,run=tr.latest_batch(data,"2026-10-28")
          print("BATCH",len(batch),"run_id",run,"total",len(data))
          tab=collections.defaultdict(list)
          for row in batch:
              tab[(row.get("sport"),row.get("stat"))].append(row)
          for (sp,stat),entries in sorted(tab.items()):
              why=collections.Counter(str(x.get("reason")) for x in entries)
              mark=[x for x in entries if isinstance(x.get("q_market_comparable"),(float,int))]
              grade=[x for x in entries if isinstance(x.get("q_grade"),(float,int))]
              ea=sum((x.get("engine_a") or {}).get("reliable") is True for x in entries)
              eb=sum((x.get("engine_b") or {}).get("reliable") is True for x in entries)
              pos=sum(x.get("q_grade",0)>=.70 for x in grade)
              qmax=max((x["q_grade"] for x in grade),default=None)
              print("STAT",sp,repr(stat),"rows",len(entries),"market",len(mark),
                    "grade",len(grade),"A_reliable",ea,"B_reliable",eb,"q_ge_70",pos,
                    "max_q",round(qmax,4) if qmax is not None else None,
                    "blockers",why.most_common(9))
          for sp in ("NBA","NHL"):
              rows=[r for r in batch if r.get("sport")==sp]
              print("SPORT_REASONS",sp,collections.Counter(str(r.get("reason")) for r in rows).most_common(22))
              grade=[r for r in rows if isinstance(r.get("q_grade"),(float,int))]
              top=sorted(grade,key=lambda x:x["q_grade"],reverse=True)[:12]
              for r in top:
                  print("TOP_MODEL",sp,json.dumps({
                    "player":r.get("player"),"stat":r.get("stat"),"side":r.get("side"),
                    "q":round(r["q_grade"],5),"market":r.get("q_market_comparable"),
                    "reason":r.get("reason"),"final_rank":r.get("final_rank"),
                    "a":(r.get("engine_a") or {}).get("reliable"),
                    "b":(r.get("engine_b") or {}).get("reliable"),
                    "n":r.get("current_role_n"),
                    "book_count":len(r.get("books") or []),
                    "flags":r.get("soft_flags"),
                  },default=str))
              for r in rows:
                  if (r.get("stat") not in ("shots on goal",) and
                          r.get("reason") in ("STATUS_NOT_VERIFIED","VENUE_OR_FORECAST_UNVERIFIED")):
                      print("ELIGIBLE_NON_SOG",sp,str(r.get("stat")),str(r.get("player")))
                      break
          try:
              import subprocess
              q=json.loads(subprocess.check_output(
                ["git","show","FETCH_HEAD:data/verification/2026-10-28/queue.json"]).decode())
              print("ARCHIVE_QUEUE",len(q.get("queue",[])),collections.Counter((x.get("sport"),x.get("stat")) for x in q.get("queue",[])))
          except Exception as e:print("QUEUE_UNAVAILABLE",type(e).__name__)
          PY

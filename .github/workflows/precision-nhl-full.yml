name: Precision Windows - NHL full-population four-market Bayesian training
run-name: NHL 4-market full history • high CPU • progress
on:
  workflow_dispatch:
    inputs:
      as_of:
        type: string
        required: true
        default: '2026-10-29'
        description: Exclusive training cutoff; excludes Oct 29 games
      max_parallel_models:
        type: choice
        required: true
        default: '4'
        options: ['2', '3', '4']
        description: Up to four NHL models concurrently; RAM guard may defer launches
      min_free_ram_mb:
        type: choice
        required: true
        default: '8192'
        options: ['8192', '10240', '12288']
        description: Free RAM guard before launching additional full-player fits
permissions:
  contents: read
concurrency:
  group: precision-windows-nhl-complete-history
  cancel-in-progress: false
jobs:
  full-nhl-training:
    runs-on: [self-hosted, Windows, X64, pickem-trainer]
    timeout-minutes: 2880
    env:
      CUTOFF: ${{ inputs.as_of }}
      MODE: pregame_fit
      MAX_PER_POSITION: '0'
      MAX_SEASONS: '12'
      PICKEM_NUTS_CHAINS: '4'
      PICKEM_NUTS_CORES: '4'
      PICKEM_NUTS_DRAWS: '2000'
      PICKEM_NUTS_TUNE: '1800'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out frozen model source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install known working Windows Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test progress bars, NHL market contract and RAM guard offline
        run: |
          python -m unittest discover -s tests -p "test_precision_nhl_campaign.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore immutable NHL history from GitHub
        run: |
          python scripts/history_warehouse_load.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify completed 2018-2026 NHL training history and snapshot
        run: |
          $ErrorActionPreference='Stop'
          python -c "import json,os,pathlib; from datetime import date; root=pathlib.Path('data/bayesian_warehouse/states'); a=json.loads((root/'nhl.json').read_text()); b=json.loads((root/'nhl_recent.json').read_text()); cutoff=os.environ['CUTOFF']; assert a['cursor'] >= '2023-10-01', 'NHL_ARCHIVE_INCOMPLETE'; assert b['cursor'] >= cutoff, 'NHL_RECENT_HISTORY_INCOMPLETE'; assert '2018-10-01' < cutoff <= date.today().isoformat(), 'FUTURE_OR_EMPTY_CUTOFF'; print('VERIFIED_NHL_FULL_SOURCE_HISTORY',a['cursor'],b['cursor'],'cutoff',cutoff)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install isolated PyMC and ArviZ numerical dependencies once
        run: |
          $venv=Join-Path $env:RUNNER_TEMP 'pickem-nhl-full-venv'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python=Join-Path $venv 'Scripts\python.exe'
          & $python -m pip install -r requirements-joint-bayes.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -c "import pymc,arviz; print('NHL_FIT_ENV_READY',pymc.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require Windows-native G++ for compiled PyTensor
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerBin = 'C:\msys64\ucrt64\bin'
          $gcc = Join-Path $compilerBin 'g++.exe'
          if (-not (Test-Path $gcc)) {
            throw 'MSYS2 UCRT64 g++ is not installed. Install MSYS2, then run pacman -S --needed mingw-w64-ucrt-x86_64-gcc. See docs/PRECISION_NHL_FULL.md'
          }
          # The self-hosted runner can be started before GCC was installed.
          # Make the path visible both now and to the following training step.
          $env:Path = "$compilerBin;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $compilerBin
          & $gcc --version
          if ($LASTEXITCODE -ne 0) { throw 'The installed Windows G++ executable did not start' }
          $python = Join-Path $env:RUNNER_TEMP 'pickem-nhl-full-venv\Scripts\python.exe'
          & $python -c "import pytensor, pytensor.tensor as pt; assert pytensor.config.cxx, 'PYTENSOR_CXX_MISSING'; x=pt.scalar('x'); fn=pytensor.function([x],x*x+1); print('PYTENSOR_CXX_VERIFIED',pytensor.config.cxx,'COMPILED_SMOKE_TEST',fn(2.0))"
          if ($LASTEXITCODE -ne 0) { throw 'PyTensor could not use the installed G++ compiler' }
      - name: Train four independent NHL models with per-chain progress bars
        id: train
        run: |
          $python=Join-Path $env:RUNNER_TEMP 'pickem-nhl-full-venv\Scripts\python.exe'
          & $python scripts/precision_nhl_campaign.py run --max-parallel ${{ inputs.max_parallel_models }} --min-free-mb ${{ inputs.min_free_ram_mb }} --stagger-seconds 240
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload NHL model progress, per-market posteriors and converged fit checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precision-nhl-full-history-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: reports/precision_training/${{ github.run_id }}/

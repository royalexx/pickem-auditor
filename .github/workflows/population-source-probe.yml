name: Experimental single-day multi-sport source verification
on:
  push:
    branches: ['feature/multisport-joint-population-20261028']
    paths: ['.github/workflows/population-source-probe.yml']
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'nflreadpy==0.1.5'
      - name: Seed exact known regular-season game dates for live parser checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/multi-probe/data/bayesian_warehouse/states')
          root.mkdir(parents=True,exist_ok=True)
          for sport,day in (('nhl','2018-10-03'),('nba','2018-10-17')):
              payload={'schema':'multi-sport-population-cursor-v1',
                       'sport':sport.upper(),'cursor':day,
                       'dates_complete':0,'source_games':0,'market_rows_inserted':0}
              root.joinpath(sport+'.json').write_text(json.dumps(payload))
          PY
      - name: Inspect public nflverse production source schema without altering data
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import nflreadpy
          from collections import Counter
          stats=nflreadpy.load_player_stats(seasons=[2018],summary_level="week").to_dicts()
          snaps=nflreadpy.load_snap_counts(seasons=[2018]).to_dicts()
          schedules=nflreadpy.load_schedules(seasons=[2018]).to_dicts()
          for name,rows in [('weekly',stats),('snap',snaps),('schedule',schedules)]:
              print(name,'rows',len(rows),'columns',sorted(rows[0]) if rows else [])
              print(name,'sample', [{k:r.get(k) for k in (('season_type','position','week','recent_team','player_display_name') if name=='weekly' else ('game_type','season','week','team','player','game_id') if name=='snap' else ('game_type','season','week','home_team','away_team','game_id'))} for r in rows[:3]])
          print('weekly season type counts',Counter(r.get('season_type') for r in stats).most_common(10))
          print('weekly position counts',Counter(r.get('position') for r in stats).most_common(12))
          print('snap game type counts',Counter(r.get('game_type') for r in snaps).most_common(8))
          PY
      - name: Test official NHL old-game hits blocks goalie saves
        id: nhl
        continue-on-error: true
        run: |
          python scripts/population_backfill.py --sport NHL \
             --root /tmp/multi-probe --max-days 1 --max-games 20 \
             --stop-before 2018-10-03 --request-spacing 0.5
      - name: Test ESPN NBA historical summary format
        id: nba
        continue-on-error: true
        run: |
          python scripts/population_backfill.py --sport NBA \
             --root /tmp/multi-probe --max-days 1 --max-games 20 \
             --stop-before 2018-10-17 --request-spacing 0.8
      - name: Test nflverse weekly and snap source
        id: nfl
        continue-on-error: true
        run: |
          python scripts/population_backfill.py --sport NFL \
             --root /tmp/multi-probe --max-days 1 --max-games 400 \
             --stop-before 2019-03-05
      - name: Upload source error classifications and progress, not fake data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-probe-receipts
          path: /tmp/multi-probe/reports/*.json
          if-no-files-found: warn
      - name: Flag incomplete live source adapters
        if: always()
        env:
          NHL: ${{ steps.nhl.outcome }}
          NBA: ${{ steps.nba.outcome }}
          NFL: ${{ steps.nfl.outcome }}
        run: |
          test "$NHL" = success && test "$NBA" = success && test "$NFL" = success || {
             echo "LIVE_SOURCE_ADAPTER_FAILURE NHL=$NHL NBA=$NBA NFL=$NFL" >&2; exit 2; }

# Recheck 2018 nflverse new team field and defense+offense uniquely matched snaps.

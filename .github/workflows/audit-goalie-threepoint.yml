name: One-off goalie saves and NBA made-threes Bayesian source audits
on:
  push:
    branches: ['audit/multisport-joint-vs-poisson-20261028']
    paths: ['.github/workflows/audit-goalie-threepoint.yml']
permissions:
  contents: read
jobs:
  real-missing-markets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: nhl_goalie_saves, sport: NHL, stat: saves, cutoff: '2018-11-05', until: '2018-11-20', line: '26.5', cohort: 0}
          - {id: nba_made_threes, sport: NBA, stat: threes, cutoff: '2018-11-02', until: '2018-11-20', line: '2.5', cohort: 18}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      SPORT: ${{ matrix.sport }}
      STAT: ${{ matrix.stat }}
      CUTOFF: ${{ matrix.cutoff }}
      UNTIL: ${{ matrix.until }}
      LINE: ${{ matrix.line }}
      COHORT: ${{ matrix.cohort }}
      ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-joint-bayes.txt
      - run: bash scripts/history_warehouse_store.sh load
      - run: python -m pip install -r requirements-joint-bayes.txt
      - name: Refit credible 4-chain shadow model on verified new market
        run: |
          python scripts/audit_joint_population.py \
            --sport "$SPORT" --stat "$STAT" \
            --cutoff "$CUTOFF" --until "$UNTIL" \
            --max-per-position "$COHORT" --line "$LINE" \
            --draws 1000 --tune 1100 \
            --out "reports/multisport_audit/$ID"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sport-stats-expanded-${{ matrix.id }}
          retention-days: 90
          if-no-files-found: warn
          path: reports/multisport_audit/${{ matrix.id }}/*.json

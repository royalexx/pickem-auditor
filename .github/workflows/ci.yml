name: Pick'em Auditor offline checks
on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.cursor/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile skill Python modules
        run: python -m compileall -q scripts
      - name: Verify connectivity classification without network
        run: python -m unittest discover -s tests -p 'test_network_receipt.py' -q
      - name: Verify morning-preflight recovery
        run: python -m unittest discover -s tests -p 'test_morning_preflight_recovery.py' -q
      - name: Verify A/B engine contracts
        run: python -m unittest discover -s tests -p 'test_engine_contracts.py' -q
      - name: Verify three-sport archival receipts
        run: python -m unittest discover -s tests -p 'test_verify_sports.py' -q
      - name: Verify lossless and idempotent legacy history migration
        run: python -m unittest discover -s tests -p 'test_history_bootstrap.py' -q
      - name: Verify original pregame estimates are immutable
        run: python -m unittest discover -s tests -p 'test_verify_history_invariants.py' -q
      - name: Verify pregame source reuse and stale-odds rejection
        run: python -m unittest discover -s tests -p 'test_afternoon_reuse.py' -q
      - name: Verify structured research never fabricates source confirmations
        run: python -m unittest discover -s tests -p 'test_auto_research.py' -q

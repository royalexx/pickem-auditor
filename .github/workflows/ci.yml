name: Pick'em Auditor offline checks
on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.cursor/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile skill Python modules
        run: python -m compileall -q scripts tests
      - name: Validate persistent shadow-store Bash syntax
        run: bash -n scripts/shadow_store.sh && bash -n scripts/history_warehouse_store.sh
      - name: Validate GitHub Actions workflow YAML
        run: |
          python -m pip install --quiet PyYAML==6.0.2
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflows=sorted(Path('.github/workflows').glob('*.yml'))
          for path in workflows:
              data=yaml.safe_load(path.read_text())
              if not isinstance(data,dict) or not isinstance(data.get('jobs'),dict):
                  raise SystemExit(f'INVALID_WORKFLOW_STRUCTURE: {path}')
              trigger=data.get('on',data.get(True))
              if trigger is None:
                  raise SystemExit(f'WORKFLOW_TRIGGER_MISSING: {path}')
              print('valid yaml:',path)
          PY
      - name: Verify connectivity classification without network
        run: python -m unittest discover -s tests -p 'test_network_receipt.py' -q
      - name: Verify morning-preflight recovery
        run: python -m unittest discover -s tests -p 'test_morning_preflight_recovery.py' -q
      - name: Verify A/B engine contracts
        run: python -m unittest discover -s tests -p 'test_engine_contracts.py' -q
      - name: Verify three-sport archival receipts
        run: python -m unittest discover -s tests -p 'test_verify_sports.py' -q
      - name: Verify lossless and idempotent legacy history migration
        run: python -m unittest discover -s tests -p 'test_history_bootstrap.py' -q
      - name: Verify original pregame estimates are immutable
        run: python -m unittest discover -s tests -p 'test_verify_history_invariants.py' -q
      - name: Verify pregame source reuse and stale-odds rejection
        run: python -m unittest discover -s tests -p 'test_afternoon_reuse.py' -q
      - name: Verify structured research never fabricates source confirmations
        run: python -m unittest discover -s tests -p 'test_auto_research.py' -q
      - name: Verify PropLine daily request quota guard
        run: python -m unittest discover -s tests -p 'test_odds_quota_guard.py' -q
      - name: Verify morning history never calls PropLine
        run: python -m unittest discover -s tests -p 'test_morning_no_odds.py' -q

      - name: Verify Bayesian Engine A shadow posterior and provenance safeguards
        run: python -m unittest discover -s tests -p test_bayesian_engine.py -q

      - name: Verify Bayesian Engine B posterior and historical provenance
        run: python -m unittest discover -s tests -p test_bayesian_usage.py -q

      - name: Verify posterior Monte Carlo reproducibility and snapshot integrity
        run: python -m unittest discover -s tests -p test_posterior_mc.py -q

      - name: Verify Phase 4 walk-forward holdouts and no-leakage validation
        run: python -m unittest discover -s tests -p test_phase4_validation.py -q

      - name: Verify NHL warehouse provenance and resumable backfill without external calls
        run: python -m unittest discover -s tests -p test_joint_nhl_history.py -q

      - name: Validate NHL, NBA and NFL historic population provenance and recovery
        run: python -m unittest discover -s tests -p test_population_multisport.py -q

      - name: Verify source-owned NBA three-point replay and unchanged other markets
        run: python -m unittest discover -s tests -p test_population_repair_nba_threes.py -q

      - name: Execute full offline unit-test suite
        run: python -m unittest discover -s tests -q

  joint-bayes-nuts-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-joint-bayes.txt
      - name: Install isolated numerical inference stack
        run: python -m pip install -r requirements-joint-bayes.txt
      - name: Validate real joint posterior graph and independent NUTS chains
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -p test_joint_nhl_pymc_smoke.py -q
      - name: Validate real multivariate NBA/NFL correlated workload and yardage NUTS
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -p test_population_joint_pymc.py -q

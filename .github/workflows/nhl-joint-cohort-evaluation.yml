name: NHL joint Bayesian dated-cohort evaluation
on:
  push:
    branches: ['feature/joint-nhl-evaluation-20261028']
    paths:
      - 'scripts/joint_nhl_*.py'
      - 'scripts/historical_nhl_warehouse.py'
      - 'tests/test_joint_nhl_*.py'
      - '.github/workflows/nhl-joint-cohort-evaluation.yml'
  workflow_dispatch:
    inputs:
      cutoff:
        description: 'Date-exclusive training cutoff YYYY-MM-DD'
        required: true
        default: '2018-10-20'
      until:
        description: 'Heldout end-exclusive YYYY-MM-DD'
        required: true
        default: '2018-10-28'
      draws:
        description: 'Samples per each of 4 NUTS chains'
        required: false
        default: '500'
      tune:
        description: 'Warmup iterations per each chain'
        required: false
        default: '500'
permissions:
  contents: read
concurrency:
  group: nhl-joint-evaluation-compiled
  cancel-in-progress: false
jobs:
  retrospective-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CUTOFF: ${{ inputs.cutoff || '2018-10-20' }}
      UNTIL: ${{ inputs.until || '2018-10-28' }}
      DRAWS: ${{ inputs.draws || '500' }}
      TUNE: ${{ inputs.tune || '500' }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-joint-bayes.txt
      - name: Restore immutable official NHL games from historical branch
        run: bash scripts/history_warehouse_store.sh load
      - name: Install isolated validated model dependencies
        run: python -m pip install -r requirements-joint-bayes.txt
      - name: Sample joint NHL population with historical cutoff
        id: fit
        continue-on-error: true
        run: |
          python scripts/joint_nhl_bayes.py --root . --as-of "$CUTOFF" \
            --min-rows 2000 --draws "$DRAWS" --tune "$TUNE" \
            --chains 4 --out reports/joint_nhl_cohort
      - name: Score strictly later completed skater games
        id: heldout
        if: steps.fit.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/joint_nhl_holdout.py --root . \
            --cutoff "$CUTOFF" --until "$UNTIL" \
            --training-dir reports/joint_nhl_cohort --draws 1500 \
            --max-games 5000
      - name: Record cohort and diagnostic receipt
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('reports/joint_nhl_cohort')
          receipt={'schema':'nhl_joint_cohort_evaluation_v1',
              'train_cutoff_exclusive':os.environ['CUTOFF'],
              'holdout_end_exclusive':os.environ['UNTIL'],
              'source_branch':'data/bayesian-history',
              'publication_eligible':False,'calibrated':False}
          for target in ('manifest','holdout_validation'):
              path=root/f'{target}.json'
              try:receipt[target]=json.loads(path.read_text())
              except FileNotFoundError:receipt[target]={'status':'missing'}
          root.mkdir(parents=True,exist_ok=True)
          (root/'evaluation_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in receipt.items() if k not in ('manifest','holdout_validation')},sort_keys=True))
          PY
      - name: Upload reproducible posterior and evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nhl-joint-2018-pregame-holdout-evaluation
          path: |
            reports/joint_nhl_cohort/manifest.json
            reports/joint_nhl_cohort/evaluation_receipt.json
            reports/joint_nhl_cohort/holdout_validation.json
            reports/joint_nhl_cohort/posterior.nc
          retention-days: 90
          if-no-files-found: warn
      - name: Explicitly fail if fit or holdout was not completed
        if: always()
        env:
          FIT: ${{ steps.fit.outcome }}
          HOLDOUT: ${{ steps.heldout.outcome }}
        run: |
          test "$FIT" = success && test "$HOLDOUT" = success || {
            echo "INCOMPLETE_OR_UNCALIBRATED_BAYESIAN_EVALUATION fit=$FIT holdout=$HOLDOUT" >&2
            exit 2
          }

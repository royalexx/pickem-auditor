name: One-off immutable Conditional Tier3 replay
on:
  push:
    branches: [feat/conditional-tier3-tendency-20261028]
    paths: [.github/workflows/conditional-tier3-replay-temporary.yml]
permissions:
  contents: read
jobs:
  historical-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore original forecast snapshots without changing any source
        run: |
          git fetch origin data/shadow-calibration
          git show FETCH_HEAD:data/prop_snapshots.jsonl > data/prop_snapshots.jsonl
      - name: Evaluate archived 2026-10-28 candidates at original research time
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'scripts')
          import research_triage as rt
          import research_packet as rp
          import conditional_tier3_board as cb
          now=datetime(2026,10,28,20,40,tzinfo=timezone.utc)
          rows=[json.loads(x) for x in Path('data/prop_snapshots.jsonl').read_text().splitlines() if x.strip()]
          q=rt.build(rows,'2026-10-28',now=now)
          packet=rp.empty_template('2026-10-28')
          c=cb.build(rows,q,packet,'2026-10-28',now=now,data_root='data')
          selected=[x for x in rt.latest_batch(rows,'2026-10-28')[0]
                    if x.get('q_grade') is not None and isinstance(x.get('q_grade'),(float,int))]
          print('ACTUAL_RESEARCH_QUEUE',len(q['queue']))
          print('ACTUAL_MAX_MODEL_PROBABILITY',max(x['q_grade'] for x in selected))
          from research_ranked_board import build as research_build
          ranked=research_build(rows,q,'2026-10-28',now=now)
          print('ELIGIBLE_RESEARCH_COUNT',len(ranked['research_ranked']))
          print('ELIGIBLE_RESEARCH_MAX',max(x['q_model'] for x in ranked['research_ranked']))
          print('CONDITIONAL_TIER3',c['conditional_count'])
          print('REJECTIONS',c['excluded'])
          assert c['conditional_count']==0
          assert c['publication_eligible'] is False
          assert max(x['q_model'] for x in ranked['research_ranked']) < .70
          PY
      - name: Check actual ESPN injury report schemas for NHL NBA and NFL
        run: |
          python - <<'PY'
          import json,urllib.request
          path={"NHL":"hockey/nhl","NBA":"basketball/nba","NFL":"football/nfl"}
          for sport,slug in path.items():
              url=f"https://site.api.espn.com/apis/site/v2/sports/{slug}/injuries"
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"pickem-auditor/1","Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      data=json.load(response)
                  blocks=data.get("injuries") if isinstance(data,dict) else None
                  print("INJURY_FEED",sport,"valid=",isinstance(blocks,list),
                        "groups=",len(blocks) if isinstance(blocks,list) else None)
              except Exception as e:
                  print("INJURY_FEED",sport,"unavailable=",type(e).__name__)
          PY

name: Precision Windows - full 31-market Bayesian overnight campaign
run-name: Precision 31-market research campaign (self-hosted)
on:
  workflow_dispatch:
    inputs:
      index:
        type: string
        description: Market index 0 through 30; start at zero for all 31
        required: true
        default: '0'
      max_per_position:
        type: choice
        description: "0 = ALL eligible historical players; 15 = limited pilot"
        required: true
        default: '0'
        options: ['0', '15']
      as_of:
        type: string
        description: Exclusive training cutoff; 2026-10-29 excludes Oct 29 games
        required: true
        default: '2026-10-29'
      code_sha:
        type: string
        description: Keep a fixed first-run code SHA for reproducible continuation
        required: false
        default: ''
      source_sha:
        type: string
        description: Frozen historical warehouse source commit for reproducibility
        required: false
        default: ''
      campaign_id:
        type: string
        description: Frozen campaign identifier
        required: false
        default: ''
  # User-authorized one-time trigger; no scheduled executions.
  push:
    paths:
      - '.training-control/start.json'

permissions:
  contents: read
  actions: write

# The continuation is dispatched by the preceding run, never all 31 at once.
concurrency:
  group: precision-windows-full-campaign
  cancel-in-progress: false

jobs:
  train-one-market:
    name: Full-population Bayesian market ${{ inputs.index }}
    runs-on: [self-hosted, Windows, X64, pickem-trainer]
    # GitHub self-hosted job execution limit is five days; no shorter repo-specific timeout.
    timeout-minutes: 7200
    env:
      INDEX: ${{ inputs.index || '0' }}
      CODE_HEAD: ${{ inputs.code_sha || github.sha }}
      SOURCE_FREEZE_SHA: ${{ inputs.source_sha || '' }}
      CAMPAIGN_ID: ${{ inputs.campaign_id || '' }}
      MODE: pregame_fit
      CUTOFF: ${{ inputs.as_of || '2026-10-29' }}
      HOLDOUT_UNTIL: ${{ inputs.as_of || '2026-10-29' }}
      LINE: '2.5'
      MAX_PER_POSITION: ${{ inputs.max_per_position || '0' }}
      MAX_SEASONS: '12'
      PICKEM_NUTS_CHAINS: '4'
      PICKEM_NUTS_CORES: '2'
      PICKEM_NUTS_DRAWS: '2000'
      PICKEM_NUTS_TUNE: '1800'
      PICKEM_STRICT_ALL_EFFECTS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out triggering commit for launch validation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up isolated Windows Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify one-time launch or recovery request
        if: github.event_name == 'push'
        run: |
          python -m unittest discover -s tests -p "test_precision_launch_guard.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/precision_launch_guard.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test frozen-history integrity and resumable market receipt cache
        run: |
          python -m unittest discover -s tests -p "test_precision_frozen_cache.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve campaign freeze helper across pinned-code checkout
        run: |
          Copy-Item scripts/precision_frozen_cache.py (Join-Path $env:RUNNER_TEMP 'precision_frozen_cache.py') -Force
      # A lightweight observation-only overlay is staged from the workflow
      # trigger commit BEFORE replacing the worktree with frozen model code.
      # Market 0 is excluded: never modify or relaunch the active SOG fit.
      - name: Stage tested NUTS health monitor for successor markets
        if: env.INDEX != '0'
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'a0ecbfdd35ee6889758fb5dea0afc44f3b9aa3db'
          $blob = (git hash-object -- scripts/precision_sampling_progress.py).Trim()
          if ($LASTEXITCODE -ne 0 -or $blob -ne $expected) { throw 'NUTS_MONITOR_SOURCE_DIGEST_MISMATCH' }
          python -m unittest discover -s tests -p 'test_precision_sampling_progress.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'NUTS_MONITOR_SELF_TEST_FAILED' }
          $staged = Join-Path $env:RUNNER_TEMP 'consultative_nuts_monitor.py'
          Copy-Item scripts/precision_sampling_progress.py $staged -Force
          $copy = (git hash-object -- $staged).Trim()
          if ($LASTEXITCODE -ne 0 -or $copy -ne $expected) { throw 'NUTS_MONITOR_STAGING_DIGEST_MISMATCH' }
          Write-Host "NUTS_MONITOR_STAGED sha=$copy advisory_only=true"
      - name: Stage verified NFL-first market route for successor markets
        if: env.INDEX != '0'
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '37dc8703b095d0a484b30c637fc010e4adb41bc3'
          $actual = (git hash-object -- scripts/precision_campaign_route.py).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw 'NFL_ROUTE_SOURCE_DIGEST_MISMATCH' }
          python -m unittest discover -s tests -p 'test_precision_campaign_route.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'NFL_ROUTE_SELF_TEST_FAILED' }
          $target = Join-Path $env:RUNNER_TEMP 'precision_campaign_route.py'
          Copy-Item scripts/precision_campaign_route.py $target -Force
          $copied = (git hash-object -- $target).Trim()
          if ($LASTEXITCODE -ne 0 -or $copied -ne $expected) { throw 'NFL_ROUTE_STAGING_DIGEST_MISMATCH' }
          Write-Host "NFL_ROUTE_STAGED sha=$copied scheme=sog_then_nfl_then_remaining"

      - name: Stage tested, pinned posterior checkpoint and diagnostic repair
        if: env.INDEX != '0'
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '15271955731ac87b7bcb2ed5bf81a39e98f1b6de'
          $actual = (git hash-object -- scripts/precision_posterior_safety_patch.py).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw 'POSTERIOR_SAFETY_SOURCE_BLOB_MISMATCH' }
          python -m unittest discover -s tests -p 'test_precision_posterior_safety_patch.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'POSTERIOR_SAFETY_TESTS_FAILED' }
          $target = Join-Path $env:RUNNER_TEMP 'precision_posterior_safety_patch.py'
          Copy-Item scripts/precision_posterior_safety_patch.py $target -Force
          $copy = (git hash-object -- $target).Trim()
          if ($LASTEXITCODE -ne 0 -or $copy -ne $expected) { throw 'POSTERIOR_SAFETY_STAGING_BLOB_MISMATCH' }
          Write-Host "POSTERIOR_SAFETY_STAGED sha=$copy original_frozen_commit=$env:CODE_HEAD"

      - name: Check out exact frozen code
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CODE_HEAD -notmatch '^[0-9a-f]{40}$') { throw 'INVALID_FROZEN_CODE_SHA' }
          git cat-file -e "$($env:CODE_HEAD)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'FROZEN_MODEL_CODE_COMMIT_NOT_FOUND' }
          git checkout --force --detach $env:CODE_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'FROZEN_CODE_CHECKOUT_FAILED' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CODE_HEAD) { throw 'FROZEN_CODE_REVISION_MISMATCH' }
          Write-Host "VERIFIED_FROZEN_CODE_SHA $actual"
      - name: Select exactly one NHL, NBA or NFL statistical market
        id: market
        run: |
          if ($env:INDEX -eq '0') {
            # Preserve the original SOG catalog entry and frozen behavior.
            python scripts/precision_campaign_catalog.py --index $env:INDEX --github-env $env:GITHUB_ENV
          } else {
            # Routing changes the order only. Identity, code and source data
            # still come from the originally frozen 31-market catalog.
            $router = Join-Path $env:RUNNER_TEMP 'precision_campaign_route.py'
            if (-not (Test-Path -PathType Leaf $router)) { throw 'NFL_ROUTE_NOT_STAGED' }
            $expected = '37dc8703b095d0a484b30c637fc010e4adb41bc3'
            $actual = (git hash-object -- $router).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw 'NFL_ROUTE_INSTALL_DIGEST_MISMATCH' }
            $folder = Join-Path 'reports/precision_training' $env:GITHUB_RUN_ID
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            python $router --index $env:INDEX --github-env $env:GITHUB_ENV --receipt (Join-Path $folder 'routing_receipt.json')
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate exact 31-market taxonomy and sequential recovery
        run: |
          python -m unittest discover -s tests -p "test_precision_campaign_catalog.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore verified frozen history cache if available
        run: |
          python (Join-Path $env:RUNNER_TEMP 'precision_frozen_cache.py') restore-history
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            'FROZEN_HISTORY_CACHE_HIT=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host 'FROZEN_HISTORY_CACHE_HIT: immutable warehouse restored from verified archive'
            exit 0
          } elseif ($code -eq 3) {
            # The Python cache-miss sentinel is expected. PowerShell Actions
            # propagates LASTEXITCODE unless explicitly reset/terminated.
            Write-Host 'FROZEN_HISTORY_CACHE_MISS: retrieving immutable source commit'
            exit 0
          } else {
            throw "FROZEN_HISTORY_CACHE_RESTORE_FAILED_$code"
          }
      - name: Retrieve frozen population history from private GitHub
        if: env.FROZEN_HISTORY_CACHE_HIT != '1'
        run: |
          python scripts/history_warehouse_load.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record immutable code and source freeze stamp
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_HEAD -notmatch '^[0-9a-f]{40}$') { throw 'MISSING_HISTORY_SOURCE_SHA' }
          if ($env:SOURCE_FREEZE_SHA -and $env:SOURCE_HEAD -ne $env:SOURCE_FREEZE_SHA) {
            throw 'HISTORY_SOURCE_FREEZE_MISMATCH'
          }
          $folder = Join-Path 'reports/precision_training' $env:GITHUB_RUN_ID
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $freeze = [ordered]@{
            schema = 'precision_campaign_freeze_v1'
            campaign_id = $env:CAMPAIGN_ID
            run_id = $env:GITHUB_RUN_ID
            index = $env:INDEX
            code_sha = $env:CODE_HEAD
            source_sha = $env:SOURCE_HEAD
            as_of_exclusive = $env:CUTOFF
            max_per_position = $env:MAX_PER_POSITION
            strict_all_effects = $env:PICKEM_STRICT_ALL_EFFECTS
            chains = $env:PICKEM_NUTS_CHAINS
            draws = $env:PICKEM_NUTS_DRAWS
            tune = $env:PICKEM_NUTS_TUNE
          }
          $freeze | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $folder 'freeze_receipt.json')
          Write-Host "FROZEN_CAMPAIGN_STAMP $($freeze | ConvertTo-Json -Compress)"
      - name: Cache immutable history and prepared market freeze on Dell
        env:
          VALIDATE_RESULT: pending
          FIT_RESULT: pending
        run: |
          python (Join-Path $env:RUNNER_TEMP 'precision_frozen_cache.py') snapshot --phase prepared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare local PyMC training environment
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'pickem-joint-env'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts\python.exe'
          & $python -m pip install -r requirements-joint-bayes.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -c "import pymc,arviz; print('WINDOWS_PYMC_READY',pymc.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify multi-season full-player source population
        id: preflight
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'pickem-joint-env\Scripts\python.exe'
          & $python scripts/precision_training_driver.py validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install observational monitor without changing the frozen model
        if: env.INDEX != '0'
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:CODE_HEAD) { throw 'FROZEN_MODEL_CODE_MISMATCH_BEFORE_MONITOR' }
          $source = Join-Path $env:RUNNER_TEMP 'consultative_nuts_monitor.py'
          if (-not (Test-Path -PathType Leaf $source)) { throw 'STAGED_NUTS_MONITOR_NOT_FOUND' }
          $expected = 'a0ecbfdd35ee6889758fb5dea0afc44f3b9aa3db'
          Copy-Item $source 'scripts/precision_sampling_progress.py' -Force
          $actual = (git hash-object -- scripts/precision_sampling_progress.py).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw 'NUTS_MONITOR_INSTALL_DIGEST_MISMATCH' }
          $changedScripts = @(git diff --name-only -- scripts)
          if (@($changedScripts | Where-Object { $_ -ne 'scripts/precision_sampling_progress.py' }).Count -ne 0) {
            throw 'FROZEN_MODEL_SOURCE_CHANGED_OUTSIDE_MONITOR'
          }
          $folder = Join-Path 'reports/precision_training' $env:GITHUB_RUN_ID
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $record = [ordered]@{
            schema = 'precision_observational_monitor_overlay_v1'
            market_index = $env:INDEX
            frozen_model_code_sha = $env:CODE_HEAD
            frozen_history_sha = $env:SOURCE_HEAD
            monitor_blob_sha = $actual
            overlay_only = 'scripts/precision_sampling_progress.py'
            changes_priors_sampler_settings_or_training_data = $false
            automatic_cancellation_or_restart_enabled = $false
            monitoring_failure_nonfatal = $true
          }
          $record | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $folder 'monitor_receipt.json')
          Write-Host "NUTS_MONITOR_INSTALLED market=$env:INDEX frozen_code=$env:CODE_HEAD monitor=$actual advisory_only=true"
      - name: Install verified output-only posterior checkpoint after frozen checkout
        if: env.INDEX != '0'
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:CODE_HEAD) { throw 'FROZEN_CODE_DRIFT_BEFORE_POSTERIOR_SAFETY' }
          $patch = Join-Path $env:RUNNER_TEMP 'precision_posterior_safety_patch.py'
          if (-not (Test-Path -PathType Leaf $patch)) { throw 'POSTERIOR_SAFETY_HELPER_MISSING' }
          $expected = '15271955731ac87b7bcb2ed5bf81a39e98f1b6de'
          $actual = (git hash-object -- $patch).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw 'POSTERIOR_SAFETY_INSTALL_BLOB_MISMATCH' }
          $folder = Join-Path 'reports/precision_training' $env:GITHUB_RUN_ID
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          python $patch --source 'scripts/joint_population_bayes.py' --receipt (Join-Path $folder 'posterior_safety_receipt.json') --expected-code-sha $env:CODE_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'POSTERIOR_SAFETY_PATCH_FAILED' }
          $changed = @(git diff --name-only -- scripts | Where-Object { $_ })
          $allowed = @('scripts/joint_population_bayes.py','scripts/precision_sampling_progress.py')
          if (@($changed | Where-Object { $allowed -notcontains $_ }).Count -ne 0) {
            throw 'FROZEN_SOURCE_CHANGED_OUTSIDE_APPROVED_OUTPUT_OVERLAYS'
          }
          if (@($changed | Where-Object { $_ -eq 'scripts/joint_population_bayes.py' }).Count -ne 1) {
            throw 'FROZEN_OUTPUT_REPAIR_NOT_INSTALLED'
          }
          Write-Host "POSTERIOR_SAFETY_INSTALLED frozen_model=$env:CODE_HEAD validation=checksum-pinned checkpoint_before_diagnostics=true"

      - name: Sample hierarchical NUTS model with four chains
        id: fit
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'pickem-joint-env\Scripts\python.exe'
          & $python scripts/precision_training_driver.py fit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write source, code and training result receipt
        if: always()
        env:
          VALIDATE_RESULT: ${{ steps.preflight.outcome }}
          FIT_RESULT: ${{ steps.fit.outcome }}
        run: |
          python scripts/precision_training_driver.py provenance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PRECHECK=$env:VALIDATE_RESULT FIT=$env:FIT_RESULT"
      - name: Persist final market state and diagnostics outside Actions workspace
        if: always()
        env:
          VALIDATE_RESULT: ${{ steps.preflight.outcome }}
          FIT_RESULT: ${{ steps.fit.outcome }}
        run: |
          python (Join-Path $env:RUNNER_TEMP 'precision_frozen_cache.py') snapshot --phase final
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload market posterior and diagnostic receipts immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precision-full-market-${{ github.run_id }}-${{ inputs.index }}
          retention-days: 90
          if-no-files-found: warn
          path: reports/precision_training/${{ github.run_id }}/
      # Only advance when preflight, four-chain fit, convergence checks,
      # provenance and artifact upload all succeeded. A failed/nonconverged
      # market must be audited before any further expensive training.
      - name: Queue the next statistical market after verified success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:NEXT_INDEX) {
            Write-Host 'FULL_31_MARKET_CAMPAIGN_COMPLETE: reached last market or catalog unavailable'
            exit 0
          }
          $data = @{
            ref = 'main'
            inputs = @{
              index = [string]$env:NEXT_INDEX
              max_per_position = [string]$env:MAX_PER_POSITION
              as_of = [string]$env:CUTOFF
              code_sha = [string]$env:CODE_HEAD
              source_sha = [string]$env:SOURCE_HEAD
              campaign_id = [string]$env:CAMPAIGN_ID
            }
          } | ConvertTo-Json -Depth 5 -Compress
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-RestMethod -Uri 'https://api.github.com/repos/royalexx/pickem-auditor/actions/workflows/precision-full-markets.yml/dispatches' -Method Post -Headers $headers -ContentType 'application/json' -Body $data
          Write-Host "NEXT_MARKET_QUEUED index=$env:NEXT_INDEX current=$env:INDEX code_sha=$env:CODE_HEAD"

name: SNF and NHL saves at public market lines 2026-11-01
on:
  push:
    branches: [codex/tonight-market-shadow-20261101]
    paths: ['scripts/tonight_market_shadow.py', '.github/workflows/tonight-market-shadow.yml']
permissions:
  contents: read
concurrency:
  group: tonight-market-shadow-20261101
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: [self-hosted, Windows, X64, pickem-trainer]
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
      PICKEM_ODDS_QUOTA_GUARD: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Fresh supported public lines and verified posterior forecasts
        run: |
          $trainedPython = 'C:\Users\alexi\Music\pickem-auditor\.venv\Scripts\python.exe'
          $ghFolder = 'C:\Program Files\GitHub CLI'
          if (Test-Path (Join-Path $ghFolder 'gh.exe')) { $env:PATH = "$ghFolder;$env:PATH" }
          & $trainedPython -m pip install -r requirements.txt -r requirements-nfl-inference.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $trainedPython scripts/tonight_market_shadow.py
          exit $LASTEXITCODE
      - name: Preserve forecasts, real market lines and source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tonight-market-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/tonight_market_shadow/2026-11-01/*.json
            reports/tonight_market_shadow/2026-11-01/data/
          retention-days: 90
          if-no-files-found: error

name: One-off real sourced lineup tendency replay
on:
  push:
    branches: [fix/lineup-tendencies-tier-semantics-20261028]
    paths: [.github/workflows/tendency-real-replay-temporary.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load original forecasts from immutable calibration branch
        run: |
          git fetch origin data/shadow-calibration
          git show FETCH_HEAD:data/prop_snapshots.jsonl > data/prop_snapshots.jsonl
      - name: Rebuild source-matched research queue without odds calls
        run: |
          python scripts/research_triage.py --date 2026-10-28 --path data/prop_snapshots.jsonl --out reports/research_triage.json > /dev/null
      - name: Live collect last five completed team rosters
        run: |
          python scripts/recent_lineup_collection.py --date 2026-10-28 --queue reports/research_triage.json --out reports/recent_lineup_collection.json
      - name: Build tendency-aware research slate and verify no artificial approvals
        run: |
          python scripts/research_ranked_board.py --date 2026-10-28 --snapshots data/prop_snapshots.jsonl --queue reports/research_triage.json --out reports/research_ranked_board.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('reports/research_ranked_board.json').read_text())
          collected=json.loads(Path('reports/recent_lineup_collection.json').read_text())
          print('LIVE_SOURCE_COLLECTION',collected['completed'],collected['source_scopes'])
          print('LIVE_COLLECTION_ATTEMPTS',[(x['team'],x['status'],x.get('reason')) for x in collected['attempts']])
          print('REAL_RESEARCH_LABELED',len(report['research_ranked']),report['rank_counts'])
          print('REAL_TENDENCIES',[(x['player'],x['lineup_tendency']['status']) for x in report['research_ranked']])
          assert len(report['research_ranked']) > 0
          assert not report['publication_eligible']
          assert all(x['research_rank'] != 'Research Tier 2' for x in report['research_ranked'])
          assert all(not x['lineup_tendency']['usable_for_verified_tier'] for x in report['research_ranked'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: real-lineup-tendencies-20261028
          path: |
            reports/recent_lineup_collection.json
            reports/research_ranked_board.json
            data/verification/2026-10-28/tendencies/
          retention-days: 7

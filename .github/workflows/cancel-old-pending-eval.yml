name: Cancel redundant pre-optimization run
on:
  push:
    branches: ['feature/joint-nhl-subset-validation-20261028']
    paths: ['.github/workflows/cancel-old-pending-eval.yml']
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl --silent --show-error --output /tmp/result --write-out '%{http_code}' \
            --request POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/royalexx/pickem-auditor/actions/runs/40727776147/cancel')
          echo "Cancellation HTTP status $status"
          test "$status" = 202 -o "$status" = 409

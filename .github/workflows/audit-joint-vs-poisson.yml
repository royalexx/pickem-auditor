name: One-off actual joint NUTS vs Poisson historical benchmark
on:
  push:
    branches: ['audit/multisport-joint-vs-poisson-20261028']
    paths: ['.github/workflows/audit-joint-vs-poisson.yml']
permissions:
  contents: read
jobs:
  real-bayesian-fits:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {id: nhl_hits, sport: NHL, stat: hits, cutoff: '2018-10-18', until: '2018-10-26', line: '2.5', cohort: 25}
          - {id: nhl_blocks, sport: NHL, stat: 'blocked shots', cutoff: '2018-10-18', until: '2018-10-26', line: '1.5', cohort: 25}
          - {id: nba_assists, sport: NBA, stat: assists, cutoff: '2018-10-23', until: '2018-10-26', line: '4.5', cohort: 30}
          - {id: nfl_targets, sport: NFL, stat: targets, cutoff: '2018-11-12', until: '2019-01-01', line: '5.5', cohort: 15}
          - {id: nfl_tackles, sport: NFL, stat: 'tackles + assists', cutoff: '2018-11-12', until: '2019-01-01', line: '5.5', cohort: 12}
          - {id: nfl_rec_yards, sport: NFL, stat: 'receiving yards', cutoff: '2018-11-12', until: '2019-01-01', line: '49.5', cohort: 15}
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      SPORT: ${{ matrix.sport }}
      STAT: ${{ matrix.stat }}
      CUTOFF: ${{ matrix.cutoff }}
      UNTIL: ${{ matrix.until }}
      LINE: ${{ matrix.line }}
      COHORT: ${{ matrix.cohort }}
      ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-joint-bayes.txt
      - name: Restore historical frozen completed player-games
        run: bash scripts/history_warehouse_store.sh load
      - name: Install scientific NUTS engine in separate evaluation job
        run: python -m pip install -r requirements-joint-bayes.txt
      - name: Fit and score four independent chains on original frozen train/holdout split
        run: |
          python scripts/audit_joint_population.py \
            --sport "$SPORT" --stat "$STAT" \
            --cutoff "$CUTOFF" --until "$UNTIL" \
            --max-per-position "$COHORT" --line "$LINE" \
            --draws 1000 --tune 1100 \
            --out "reports/multisport_audit/$ID"
      - name: Retain source and diagnostic results even for rejected model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-stat-compare-${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            reports/multisport_audit/${{ matrix.id }}/audit_receipt.json
            reports/multisport_audit/${{ matrix.id }}/sampling_diagnostics.json
            reports/multisport_audit/${{ matrix.id }}/full_holdout.json

# Retest after off-diagonal LKJ convergence fix and positional market eligibility correction.

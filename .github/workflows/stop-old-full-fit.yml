name: Stop superseded unidentifiable single-season full fit
on:
  push:
    branches: ['feature/joint-nhl-subset-validation-20261028']
    paths: ['.github/workflows/stop-old-full-fit.yml']
permissions:
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Stop obsolete compiled full fit after confirmed structural correction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl --silent --show-error --output /tmp/result --write-out '%{http_code}' \
            --request POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/royalexx/pickem-auditor/actions/runs/40727798962/force-cancel')
          echo "Obsolete full fit stop HTTP $code"
          test "$code" = 202 -o "$code" = 409

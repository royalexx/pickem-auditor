name: One-off 2026-10-28 tier-eligible research and prior-season source replay
on:
  push:
    branches: ['fix/research-ranking-eligibility-20261028']
    paths: ['.github/workflows/oneoff-research-repair-proof.yml']
permissions:
  contents: read
jobs:
  research-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: bash scripts/shadow_store.sh load
      - name: Rebuild October 28 queue using immutable real afternoon forecast batch
        run: |
          python scripts/research_triage.py --date 2026-10-28 \
            --path data/prop_snapshots.jsonl \
            --packet data/verification/2026-10-28/packet.json \
            --out reports/repair_queue.json --limit 30
          python - <<'PY'
          import json
          q=json.load(open('reports/repair_queue.json'))
          assert q['forecasts_evaluated']==1248,q['forecasts_evaluated']
          assert q['tier_candidate_selected']>=8,q
          assert q['queue'][0]['verification_priority_class']=='tier_candidate',q['queue'][0]
          print('REAL_TIER_PRIORITY_PASS',
                q['tier_candidate_selected'],q['review_queue_count'],
                [(x['player'],x['provisional_gap']) for x in q['queue'][:10]])
          PY
      - name: Investigate actual tier-capable subjects using live official current and prior season feeds
        run: |
          python scripts/autonomous_investigator.py \
            --date 2026-10-28 --phase initial --limit 30 \
            --snapshots data/prop_snapshots.jsonl \
            --queue reports/repair_queue.json \
            --packet data/verification/2026-10-28/packet.json \
            --data-root data --out reports/repair_investigation.json
      - name: Verify source sample receipts and no unauthorized ranking
        run: |
          python - <<'PY'
          import json
          d=json.load(open('reports/repair_investigation.json'))
          print('REAL_RESEARCH_OBSERVATIONS',d['selected_candidates'],
                d['confirmed_active_subjects'],d['counts'])
          print('PRIOR_SEASON_AUDITED',[
              (c['player'],c['prior_season_extension']['additional_games'])
              for c in d['candidates'] if c.get('prior_season_extension')])
          assert d['selected_candidates']>=8
          assert d['publication_eligible'] is False
          assert any(c.get('prior_season_extension') for c in d['candidates'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-priority-source-audit-20261028
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/repair_queue.json
            reports/repair_investigation.json

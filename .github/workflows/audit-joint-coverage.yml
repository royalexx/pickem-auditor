name: One-off independent multi-sport Bayesian benchmark coverage preflight
on:
  push:
    branches: ['audit/multisport-joint-vs-poisson-20261028']
    paths: ['.github/workflows/audit-joint-coverage.yml']
permissions:
  contents: read
jobs:
  historical-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load committed original historical sources
        run: bash scripts/history_warehouse_store.sh load
      - name: Verify all source markets and actual feasible dated holdouts
        run: |
          set -e
          mkdir -p reports/multisport_audit
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'scripts')
          import audit_joint_population as audit
          from pathlib import Path
          combinations=[
            ('NHL','shots on goal','2018-10-18','2018-10-26',20),
            ('NHL','hits','2018-10-18','2018-10-26',25),
            ('NHL','blocked shots','2018-10-18','2018-10-26',25),
            ('NHL','saves','2018-10-18','2018-10-26',0),
            ('NBA','points','2018-10-23','2018-10-26',30),
            ('NBA','assists','2018-10-23','2018-10-26',30),
            ('NBA','threes','2018-10-23','2018-10-26',30),
            ('NBA','rebounds','2018-10-23','2018-10-26',30),
            ('NFL','targets','2018-11-12','2019-01-01',15),
            ('NFL','receiving yards','2018-11-12','2019-01-01',15),
            ('NFL','tackles + assists','2018-11-12','2019-01-01',12),
            ('NFL','passing yards','2018-11-12','2019-01-01',15),
          ]
          reports=[]
          for sport,stat,cutoff,until,max_per_position in combinations:
              item=audit.inspection(Path('.'),sport,stat,cutoff,until,max_per_position)
              reports.append(item)
              print('HISTORICAL_COVERAGE '+json.dumps(item,sort_keys=True),flush=True)
          Path('reports/multisport_audit/source_coverage.json').write_text(
              json.dumps(reports,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-comparison-coverage
          path: reports/multisport_audit/source_coverage.json
          if-no-files-found: error
          retention-days: 90

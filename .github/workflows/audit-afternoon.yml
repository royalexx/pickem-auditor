name: Audit persisted afternoon forecasts
on:
  push:
    paths:
      - '.github/workflows/audit-afternoon.yml'
      - 'scripts/audit_afternoon.py'
  workflow_dispatch:
    inputs:
      date:
        description: 'Slate date (YYYY-MM-DD); defaults to current Toronto date'
        required: false
        type: string
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore persisted calibration forecasts
        run: |
          git fetch origin data/shadow-calibration
          git show FETCH_HEAD:data/prop_snapshots.jsonl > data/prop_snapshots.jsonl
      - name: Audit new model forecasts and evidence gates without network calls
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          SLATE_DATE="${INPUT_DATE:-$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("America/Toronto")).date().isoformat())')}"
          python scripts/audit_afternoon.py --date "$SLATE_DATE"
      - name: Publish audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afternoon-rank-audit
          path: reports/afternoon_audit.json

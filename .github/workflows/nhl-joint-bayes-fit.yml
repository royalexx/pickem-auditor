name: NHL fully Bayesian joint offline training
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Exclusive cutoff YYYY-MM-DD; never use later games'
        required: true
        type: string
      draws:
        description: 'Posterior draws per chain'
        required: false
        default: '1000'
      tune:
        description: 'Warmup steps per chain'
        required: false
        default: '1000'
      min_rows:
        description: 'Minimum historical player-games to begin training'
        required: false
        default: '8000'
permissions:
  contents: read
concurrency:
  group: nhl-joint-offline-training
  cancel-in-progress: false
jobs:
  fit-joint-nhl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-joint-bayes.txt
      - name: Restore source-verified historical warehouse
        run: bash scripts/history_warehouse_store.sh load
      - name: Install isolated Bayesian sampling environment
        run: python -m pip install -r requirements-joint-bayes.txt
      - name: Joint hierarchical posterior with independent NUTS chains
        id: sampling
        continue-on-error: true
        env:
          CUTOFF: ${{ inputs.as_of }}
          DRAWS: ${{ inputs.draws }}
          TUNE: ${{ inputs.tune }}
          MIN_ROWS: ${{ inputs.min_rows }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python scripts/joint_nhl_bayes.py \
            --as-of "$CUTOFF" --min-rows "$MIN_ROWS" \
            --draws "$DRAWS" --tune "$TUNE" --chains 4 \
            --max-seasons 8 --out reports/joint_nhl
      - name: Preserve immutable diagnostic artifacts regardless of fit outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nhl-joint-bayesian-nuts-posterior
          path: |
            reports/joint_nhl/manifest.json
            reports/joint_nhl/posterior.nc
          retention-days: 90
          if-no-files-found: warn
      - name: Do not approve incomplete or nonconverged inference
        if: always()
        env:
          FIT_OUTCOME: ${{ steps.sampling.outcome }}
        run: |
          test "$FIT_OUTCOME" = success || { echo 'JOINT_POSTERIOR_NOT_VALIDATED' >&2; exit 2; }

name: Pickem morning and afternoon
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Run morning settlement or afternoon pregame collection
        required: true
        type: choice
        options: [morning, afternoon]
  push:
    paths:
      - '.github/workflows/pickem-daily.yml'
      - 'scripts/verify_sports.py'
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'
permissions:
  contents: write
concurrency:
  group: pickem-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Toronto schedule window
        id: gate
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo
          with open(os.environ['GITHUB_EVENT_PATH']) as f: event=json.load(f)
          trigger=os.environ['GITHUB_EVENT_NAME']
          phase='morning' if trigger=='push' else event.get('inputs',{}).get('phase','skip')
          if trigger=='schedule':
              phase='skip'
              fields=str(event.get('schedule','')).split()
              if len(fields)==5:
                  now=datetime.now(timezone.utc)
                  planned=now.replace(hour=int(fields[1]),minute=int(fields[0]),second=0,microsecond=0)
                  if planned>now+timedelta(minutes=2): planned-=timedelta(days=1)
                  local=planned.astimezone(ZoneInfo('America/Toronto'))
                  if timedelta(0)<=now-planned<timedelta(hours=12) and local.minute==0:
                      phase={6:'morning',16:'afternoon'}.get(local.hour,'skip')
                  print('Scheduled local slot:',local.isoformat())
          if phase not in ('morning','afternoon'): phase='skip'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('phase='+phase+'\n')
          print('Running:',phase)
          PY
      - name: Run feeds, preserve verified data and produce receipt
        if: steps.gate.outputs.phase != 'skip'
        id: pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PHASE: ${{ steps.gate.outputs.phase }}
        run: |
          python - <<'PY'
          import json,os,subprocess,sys
          from datetime import datetime,timezone
          from pathlib import Path
          phase=os.environ['PHASE']
          logs=Path('reports/stages')
          logs.mkdir(parents=True,exist_ok=True)
          receipt={'phase':phase,'started_at_utc':datetime.now(timezone.utc).isoformat(),
                   'stages':{},'archive_seed': 'data/history-archive'}
          def step(label,command):
              with (logs/(label+'.log')).open('w') as out:
                  try: status=subprocess.run(command,stdout=out,stderr=subprocess.STDOUT,
                                          timeout=2700,check=False).returncode
                  except subprocess.TimeoutExpired: status=124
                  except OSError: status=125
              receipt['stages'][label]={'returncode':status,'ok':status==0}
              print(label,'SUCCESS' if status==0 else 'FAILED',status,flush=True)
              return status==0
          step('nhl_boxscores',[sys.executable,'scripts/nhl_collect.py','--days','3'])
          step('install_dependencies',[sys.executable,'-m','pip','install','-r','requirements.txt'])
          step('restore_forecasts',['bash','scripts/shadow_store.sh','load'])
          if Path('reports/history_bootstrap.json').exists():
              try:
                  receipt['history_bootstrap']=json.loads(Path('reports/history_bootstrap.json').read_text())
              except (OSError,ValueError):
                  receipt['history_bootstrap']={'error':'INVALID_BOOTSTRAP_RECEIPT'}
          receipt['persisted_forecasts_loaded']=Path('data/prop_snapshots.jsonl').is_file()
          step('multisport_slate',[sys.executable,'scripts/fetch_slate.py','--out','data/slate_fetch.jsonl'])
          step('sport_coverage',[sys.executable,'scripts/verify_sports.py','--slot',phase])
          coverage=Path('reports/sport_coverage.json')
          if coverage.exists():
              try:
                  sport_stats=json.loads(coverage.read_text())
                  receipt['sport_coverage']={k:sport_stats.get(k) for k in ('status','date','retrieved_at','source_rows','feed_status','errors')}
              except (ValueError,OSError):
                  receipt['sport_coverage']={'status':'invalid_receipt'}
          archive=Path('data/prop_snapshots.jsonl')
          if phase=='morning':
              if archive.is_file():
                  step('settle_forecasts',[sys.executable,'scripts/jobs.py','settle'])
              else:
                  receipt['stages']['settle_forecasts']={'ok':False,'error':'OLD_LIBRARY_ARCHIVE_NOT_IMPORTED'}
          elif not os.environ.get('ODDS_API_KEY'):
              receipt['stages']['pregame_engines']={'ok':False,'error':'ODDS_API_KEY_SECRET_MISSING'}
          else:
              step('pregame_engines',[sys.executable,'scripts/jobs.py','snapshot'])
          nhl=Path('reports/nhl_collection_receipt.json')
          if nhl.exists():
              try:
                  report=json.loads(nhl.read_text())
                  receipt['nhl']={k:report.get(k) for k in ('status','completed_games','player_rows','written_games','errors')}
              except (OSError,ValueError):
                  receipt['nhl']={'error':'INVALID_NHL_RECEIPT'}
          receipt['finished_at_utc']=datetime.now(timezone.utc).isoformat()
          Path('reports/daily_receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Commit official NHL history
        if: always() && steps.gate.outputs.phase != 'skip'
        id: persist
        continue-on-error: true
        run: |
          git config user.name pickem-auditor-bot
          git config user.email pickem-auditor-bot@users.noreply.github.com
          git add data/nhl/games/ data/history_slate/ || true
          if ! git diff --cached --quiet; then
            git commit -m 'data: completed NHL histories'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No new completed NHL games'
          fi
          if [ -f data/prop_snapshots.jsonl ]; then
            bash scripts/shadow_store.sh save
          else
            echo 'No timestamped forecasts to persist'
          fi
      - name: Upload collection receipt
        if: always() && steps.gate.outputs.phase != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: pickem-daily-receipt
          path: |
            reports/daily_receipt.json
            reports/nhl_collection_receipt.json
            reports/sport_coverage.json
            reports/history_bootstrap.json
            data/slate_fetch.meta.json
            data/slate_fetch.jsonl.meta.json
            data/slate_fetch.jsonl.failed.json
          retention-days: 90
          if-no-files-found: warn
      - name: Fail incomplete run visibly
        if: always() && steps.gate.outputs.phase != 'skip'
        env:
          PERSISTENCE: ${{ steps.persist.outcome }}
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          p=Path('reports/daily_receipt.json')
          if not p.exists():
              print('NO_RUN_RECEIPT');sys.exit(2)
          result=json.loads(p.read_text())
          failed=[k for k,v in result['stages'].items() if not v.get('ok')]
          if os.environ.get('PERSISTENCE')!='success':failed.append('history_persistence')
          print('Unfinished stages:',failed)
          sys.exit(2 if failed else 0)
          PY

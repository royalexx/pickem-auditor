name: Pickem morning and afternoon
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Run morning settlement or afternoon pregame collection
        required: true
        type: choice
        options: [morning, afternoon]
      force_morning:
        description: 'Explicitly rerun today even if a successful morning settlement marker exists'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/morning-recovery/*.json']
  workflow_run:
    workflows: ['NHL Bayesian history warehouse backfill']
    types: [completed]
  schedule:
    # Offset from the top of the hour to reduce GitHub cron congestion.
    # 06:13 and 16:13 Toronto (both DST and standard UTC hours).
    - cron: '13 10 * * *'
    - cron: '13 11 * * *'
    # Backups: 07:41 and 08:41 EDT / 06:41 and 07:41 EST.
    # A persisted marker stops a second completed settlement.
    - cron: '41 11 * * *'
    - cron: '41 12 * * *'
    # Independent 09:37 local watchdog window.
    - cron: '37 13 * * *'
    - cron: '37 14 * * *'
    - cron: '13 20 * * *'
    - cron: '13 21 * * *'
permissions:
  contents: write
concurrency:
  group: pickem-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Toronto schedule window and avoid duplicate settlements
        id: gate
        run: |
          python scripts/morning_schedule.py gate \
            --event-path "$GITHUB_EVENT_PATH" \
            --trigger "$GITHUB_EVENT_NAME" \
            --output "$GITHUB_OUTPUT"
      - name: Run feeds, preserve verified data and produce receipt
        if: steps.gate.outputs.phase != 'skip'
        id: pipeline
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          # One-region, one-market, max eight event odds requests; no effect
          # unless the independent secret has been configured.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PICKEM_ENABLE_ODDS_API_NHL_BLOCKS: '1'
          PHASE: ${{ steps.gate.outputs.phase }}
          GH_TOKEN: ${{ github.token }}
          PICKEM_ODDS_QUOTA_GUARD: '1'
          PICKEM_DISABLE_ODDS: ${{ steps.gate.outputs.phase == 'morning' && '1' || '0' }}
        run: |
          python - <<'PY'
          import json,os,subprocess,sys
          from datetime import datetime,timezone
          from pathlib import Path
          phase=os.environ['PHASE']
          logs=Path('reports/stages')
          logs.mkdir(parents=True,exist_ok=True)
          receipt={'phase':phase,'started_at_utc':datetime.now(timezone.utc).isoformat(),
                   'stages':{},'archive_seed': 'data/history-archive'}
          def step(label,command):
              with (logs/(label+'.log')).open('w') as out:
                  try: status=subprocess.run(command,stdout=out,stderr=subprocess.STDOUT,
                                          timeout=2700,check=False).returncode
                  except subprocess.TimeoutExpired: status=124
                  except OSError: status=125
              receipt['stages'][label]={'returncode':status,'ok':status==0}
              print(label,'SUCCESS' if status==0 else 'FAILED',status,flush=True)
              return status==0
          step('nhl_boxscores',[sys.executable,'scripts/nhl_collect.py','--days','3'])
          step('install_dependencies',[sys.executable,'-m','pip','install','-r','requirements.txt'])
          step('restore_forecasts',['bash','scripts/shadow_store.sh','load'])
          if Path('reports/history_bootstrap.json').exists():
              try:
                  receipt['history_bootstrap']=json.loads(Path('reports/history_bootstrap.json').read_text())
              except (OSError,ValueError):
                  receipt['history_bootstrap']={'error':'INVALID_BOOTSTRAP_RECEIPT'}
          receipt['persisted_forecasts_loaded']=Path('data/prop_snapshots.jsonl').is_file()
          step('multisport_slate',[sys.executable,'scripts/fetch_slate.py','--out','data/slate_fetch.jsonl'])
          step('sport_coverage',[sys.executable,'scripts/verify_sports.py','--slot',phase])
          step('market_coverage',[sys.executable,'scripts/market_coverage_audit.py',
               '--quotes','data/odds_quotes.jsonl','--slate','data/slate_fetch.jsonl',
               '--out','reports/market_coverage.json'] + (['--odds-disabled'] if phase=='morning' else []))
          if Path('reports/market_coverage.json').is_file():
              try:
                  market_report=json.loads(Path('reports/market_coverage.json').read_text())
                  receipt['market_coverage']={k:market_report.get(k) for k in
                      ('schema','source_quote_rows','source_slate_rows','absent_supported')}
              except (OSError,ValueError):
                  receipt['market_coverage']={'status':'INVALID_MARKET_COVERAGE'}
          coverage=Path('reports/sport_coverage.json')
          if coverage.exists():
              try:
                  sport_stats=json.loads(coverage.read_text())
                  receipt['sport_coverage']={k:sport_stats.get(k) for k in ('status','date','retrieved_at','source_rows','feed_status','errors')}
              except (ValueError,OSError):
                  receipt['sport_coverage']={'status':'invalid_receipt'}
          meta_path=Path('data/slate_fetch.meta.json')
          if meta_path.is_file():
              try:
                  source_meta=json.loads(meta_path.read_text())
                  odds_feed=(source_meta.get('feeds') or {}).get('odds') or {}
                  odds_notes=' '.join(str(x) for x in (odds_feed.get('notes') or []))
                  receipt['odds_coverage']={
                      'feed_status':odds_feed.get('status'),
                      'quote_rows':odds_feed.get('rows',0),
                      'unauthorized_bulk_requests':odds_notes.count('HTTP 401'),
                      'limited_coverage':bool('HTTP 401' in odds_notes or 'daily_limit_exceeded' in odds_notes),
                      'source_timestamp':source_meta.get('retrieved_at'),
                      'note':'Valid quotes are usable; unavailable or unauthorized event markets are never invented.'
                  }
              except (OSError,ValueError,TypeError):
                  receipt['odds_coverage']={'error':'INVALID_SOURCE_META'}
          archive=Path('data/prop_snapshots.jsonl')
          if phase=='morning':
              step('nfl_context_settled_audit',[sys.executable,'scripts/nfl_context_daily.py','audit','--refresh-actuals'])
              if archive.is_file():
                  settle_ok=step('settle_forecasts',[sys.executable,'scripts/jobs.py','settle'])
                  if settle_ok:
                      step('posterior_mc_settled_audit',[sys.executable,
                           'scripts/posterior_mc_audit.py','--original','data/prop_snapshots.jsonl',
                           '--mc-dir','data/posterior_mc','--out','reports/posterior_mc_audit.json'])
                      if Path('reports/posterior_mc_audit.json').is_file():
                          try:
                              audit=json.loads(Path('reports/posterior_mc_audit.json').read_text())
                              receipt['posterior_mc_audit']={k:audit.get(k) for k in
                                  ('schema','status','examined_shadow_predictions',
                                   'matched_settled_forecasts','publication_eligible')}
                          except (OSError,ValueError):
                              receipt['posterior_mc_audit']={'status':'INVALID_MC_AUDIT_RECEIPT'}
                      validation_ok=step('phase4_chronological_validation',[sys.executable,
                           'scripts/phase4_validation.py','--original','data/prop_snapshots.jsonl',
                           '--a-dir','data/bayesian_shadow','--b-dir','data/bayesian_b_shadow',
                           '--mc-dir','data/posterior_mc','--out','reports/phase4_validation.json'])
                      if validation_ok and Path('reports/phase4_validation.json').is_file():
                          try:
                              phase4=json.loads(Path('reports/phase4_validation.json').read_text())
                              receipt['phase4_validation']={
                                  'schema':phase4.get('schema'),
                                  'status':phase4.get('status'),
                                  'coverage':phase4.get('coverage'),
                                  'split':phase4.get('split'),
                                  'publication_eligible':phase4.get('publication_eligible'),
                                  'changes_model_weights':phase4.get('changes_model_weights')}
                          except (OSError,ValueError):
                              receipt['phase4_validation']={'status':'INVALID_PHASE4_REPORT'}
              else:
                  receipt['stages']['settle_forecasts']={'ok':False,'error':'HISTORY_SNAPSHOT_MISSING'}
          elif phase=='afternoon':
              if not os.environ.get('PROPLINE_API_KEY'):
                  receipt['stages']['pregame_engines']={'ok':False,'error':'PROPLINE_API_KEY_SECRET_MISSING'}
              else:
                  step('source_research',[sys.executable,'scripts/auto_research.py'])
                  if Path('reports/structured_research.json').exists():
                      try:
                          receipt['structured_research']=json.loads(Path('reports/structured_research.json').read_text())
                      except (ValueError,OSError):
                          receipt['structured_research']={'error':'INVALID_RESEARCH_RECEIPT'}
                  pregame_ok=step('pregame_engines',[sys.executable,'scripts/jobs.py','snapshot','--reuse-collected'])
                  # Prospective Bayesian Engine A is an independent shadow sidecar.
                  # Never overwrite history-v5 or grant ranking eligibility.
                  bayes_a_ok=False
                  bayes_b_ok=False
                  if pregame_ok and Path('data/prop_snapshots.jsonl').is_file():
                      bayes_date=datetime.now(timezone.utc).astimezone(__import__('zoneinfo').ZoneInfo('America/Toronto')).date().isoformat()
                      bayes_a_ok=step('bayesian_a_shadow',[sys.executable,'scripts/bayesian_shadow.py',
                           '--date',bayes_date,'--snapshots','data/prop_snapshots.jsonl',
                           '--data-root','data','--out',f'data/bayesian_shadow/{bayes_date}.jsonl',
                           '--receipt','reports/bayesian_a_shadow_receipt.json'])
                      receipt_path=Path('reports/bayesian_a_shadow_receipt.json')
                      if receipt_path.exists():
                          try:
                              b=json.loads(receipt_path.read_text())
                              receipt['bayesian_a_shadow']={k:b.get(k) for k in
                                  ('schema','date','model_version','previously_recorded','new_rows',
                                   'forecast_count','unavailable_count','total_rows','reasons','publication_eligible')}
                          except (OSError,ValueError):
                              receipt['bayesian_a_shadow']={'status':'INVALID_BAYESIAN_SHADOW_RECEIPT'}
                  if pregame_ok and Path('data/prop_snapshots.jsonl').is_file():
                      bayes_b_ok=step('bayesian_b_shadow',[sys.executable,'scripts/bayesian_b_shadow.py',
                           '--date',bayes_date,'--snapshots','data/prop_snapshots.jsonl',
                           '--data-root','data','--out',f'data/bayesian_b_shadow/{bayes_date}.jsonl',
                           '--receipt','reports/bayesian_b_shadow_receipt.json'])
                      receipt_path=Path('reports/bayesian_b_shadow_receipt.json')
                      if receipt_path.exists():
                          try:
                              b=json.loads(receipt_path.read_text())
                              receipt['bayesian_b_shadow']={k:b.get(k) for k in
                                  ('schema','date','model_version','previously_recorded','new_rows',
                                   'forecast_count','unavailable_count','total_rows','reasons','publication_eligible')}
                          except (OSError,ValueError):
                              receipt['bayesian_b_shadow']={'status':'INVALID_BAYESIAN_B_SHADOW_RECEIPT'}
                  # Only consume pregame A/B shadow sidecars. Keep MC's
                  # integration error distinct from posterior uncertainty.
                  if pregame_ok and bayes_a_ok and bayes_b_ok and Path('data/prop_snapshots.jsonl').is_file():
                      step('posterior_monte_carlo',[sys.executable,'scripts/posterior_mc_shadow.py',
                           '--date',bayes_date,'--original','data/prop_snapshots.jsonl',
                           '--data-root','data','--out',f'data/posterior_mc/{bayes_date}.jsonl',
                           '--receipt','reports/posterior_mc_receipt.json'])
                      mc_receipt=Path('reports/posterior_mc_receipt.json')
                      if mc_receipt.is_file():
                          try:
                              mc_data=json.loads(mc_receipt.read_text())
                              receipt['posterior_monte_carlo']={k:mc_data.get(k) for k in
                                  ('schema','date','model_version','previously_recorded','new_rows',
                                   'total_rows','engines','publication_eligible')}
                          except (OSError,ValueError):
                              receipt['posterior_monte_carlo']={'status':'INVALID_MONTE_CARLO_RECEIPT'}
                  if Path('data/prop_snapshots.jsonl').is_file():
                      step('afternoon_rank_audit',[sys.executable,'scripts/audit_afternoon.py','--date',datetime.now(timezone.utc).astimezone(__import__('zoneinfo').ZoneInfo('America/Toronto')).date().isoformat()])
                  if Path('data/prop_snapshots.jsonl').is_file():
                      triage_date=datetime.now(timezone.utc).astimezone(__import__('zoneinfo').ZoneInfo('America/Toronto')).date().isoformat()
                      step('research_triage',[sys.executable,'scripts/research_triage.py',
                           '--date',triage_date,'--path','data/prop_snapshots.jsonl',
                           '--packet',f'data/research_{triage_date}.json',
                           '--out','reports/research_triage.json'])
                  if Path('reports/research_triage.json').exists():
                      try:
                          triage=json.loads(Path('reports/research_triage.json').read_text())
                          receipt['research_triage']={k:triage.get(k) for k in
                              ('status','forecasts_evaluated','numerically_gradeable',
                               'unverified_research','qualified_before_caps','review_queue_count',
                               'review_queue_both_engines_reliable','blocker_categories')}
                      except (ValueError,OSError):
                          receipt['research_triage']={'error':'INVALID_RESEARCH_TRIAGE'}
                  if Path('reports/research_triage.json').is_file():
                      step('recent_lineup_tendencies',[sys.executable,'scripts/recent_lineup_collection.py',
                           '--date',triage_date,'--queue','reports/research_triage.json',
                           '--data-root','data','--out','reports/recent_lineup_collection.json'])
                  if Path('reports/research_triage.json').is_file():
                      step('review_template',[sys.executable,'scripts/review_template.py',
                           '--date',triage_date,'--snapshots','data/prop_snapshots.jsonl',
                           '--queue','reports/research_triage.json',
                           '--limit','30','--out','reports/review_template.json'])
                  if Path('reports/research_triage.json').is_file() and Path(f'data/research_{triage_date}.json').is_file():
                      step('autonomous_investigator',[sys.executable,'scripts/autonomous_investigator.py',
                           '--date',triage_date,'--phase','initial','--limit','30',
                           '--snapshots','data/prop_snapshots.jsonl',
                           '--queue','reports/research_triage.json',
                           '--packet',f'data/research_{triage_date}.json',
                           '--data-root','data',
                           '--out','reports/autonomous_investigation.json'])
                  if Path('reports/autonomous_investigation.json').is_file():
                      try:
                          auto=json.loads(Path('reports/autonomous_investigation.json').read_text())
                          receipt['autonomous_investigation']={
                              k:auto.get(k) for k in ('schema','date','selected_candidates',
                                  'source_calls_attempted','confirmed_active_subjects',
                                  'counts','research_complete','publication_eligible')}
                      except (OSError,ValueError):
                          receipt['autonomous_investigation']={'status':'INVALID_INVESTIGATOR_REPORT'}
                  # Initial verification is a new source-linked decision, never
                  # an edit to the 4 p.m. shadow forecast. Missing reviewer facts
                  # deliberately produce blocked decisions, not invented picks.
                  if Path('reports/research_triage.json').is_file() and Path(f'data/research_{triage_date}.json').is_file():
                      command=[sys.executable,'scripts/pick_verification.py','--date',triage_date,
                               '--phase','initial','--limit','30','--auto-review',
                               '--queue','reports/research_triage.json',
                               '--packet',f'data/research_{triage_date}.json',
                               '--snapshots','data/prop_snapshots.jsonl',
                               '--archive-root','data/verification',
                               '--out','reports/pick_verification.json']
                      quotes=Path('data/odds_quotes.jsonl')
                      if quotes.is_file():
                          command.extend(['--quotes-file',str(quotes)])
                      reviewed=Path(f'data/review_submissions/{triage_date}.json')
                      if reviewed.is_file():
                          command.extend(['--reviews',str(reviewed)])
                      step('pick_verification',command)
                  if Path('data/verification').is_dir():
                      step('verified_board',[sys.executable,'scripts/verified_board.py',
                           '--date',triage_date,'--snapshots','data/prop_snapshots.jsonl',
                           '--archive-root','data/verification',
                           '--out','reports/verified_board.json'])
                  if Path('reports/research_triage.json').is_file() and Path('data/prop_snapshots.jsonl').is_file():
                      step('research_ranked_board',[sys.executable,'scripts/research_ranked_board.py',
                           '--date',triage_date,'--snapshots','data/prop_snapshots.jsonl',
                           '--queue','reports/research_triage.json',
                           '--archive-root','data/verification',
                           '--out','reports/research_ranked_board.json'])
                  if Path('reports/research_triage.json').is_file() and Path(f'data/verification/{triage_date}/packet.json').is_file():
                      conditional=[sys.executable,'scripts/conditional_tier3_board.py',
                           '--date',triage_date,'--snapshots','data/prop_snapshots.jsonl',
                           '--queue','reports/research_triage.json',
                           '--packet',f'data/verification/{triage_date}/packet.json',
                           '--archive-root','data/verification',
                           '--out','reports/conditional_tier3_board.json']
                      quotes=Path('data/odds_quotes.jsonl')
                      if quotes.is_file():
                          conditional.extend(['--quotes-file',str(quotes)])
                      reviewed=Path(f'data/review_submissions/{triage_date}.json')
                      if reviewed.is_file():
                          conditional.extend(['--reviews',str(reviewed)])
                      step('conditional_tier3_board',conditional)
                  if Path('reports/conditional_tier3_board.json').is_file():
                      try:
                          conditional_board=json.loads(Path('reports/conditional_tier3_board.json').read_text())
                          receipt['conditional_tier3_board']={k:conditional_board.get(k) for k in
                              ('schema','status','conditional_count','excluded','publication_eligible')}
                      except (ValueError,OSError):
                          receipt['conditional_tier3_board']={'status':'INVALID_CONDITIONAL_BOARD'}
                  if Path('reports/research_ranked_board.json').is_file():
                      try:
                          research_board=json.loads(Path('reports/research_ranked_board.json').read_text())
                          receipt['research_ranked_board']={k:research_board.get(k) for k in
                               ('schema','status','queue_size','rank_counts','excluded',
                                'publication_eligible')}
                      except (ValueError,OSError):
                          receipt['research_ranked_board']={'status':'INVALID_RESEARCH_RANKING'}
                  if Path('reports/verified_board.json').is_file():
                      try:
                          board=json.loads(Path('reports/verified_board.json').read_text())
                          receipt['verified_board']={k:board.get(k) for k in
                              ('schema','status','original_forecasts_in_batch','valid_decision_subjects',
                               'rank_counts','excluded','invalid_receipts')}
                      except (ValueError,OSError):
                          receipt['verified_board']={'status':'INVALID_BOARD'}
                  if Path('reports/pick_verification.json').is_file():
                      try:
                          verified=json.loads(Path('reports/pick_verification.json').read_text())
                          receipt['pick_verification']={k:verified.get(k) for k in
                              ('schema','status','date','checked','verified','blocked','queue_size',
                               'source_forecast_run_id','market_source_note','source_coverage')}
                      except (ValueError,OSError):
                          receipt['pick_verification']={'status':'INVALID_VERIFICATION_RECEIPT'}
                  if Path('reports/afternoon_audit.json').exists():
                      try:
                          receipt['afternoon_audit']=json.loads(Path('reports/afternoon_audit.json').read_text())
                      except (ValueError,OSError):
                          receipt['afternoon_audit']={'status':'invalid_audit_receipt'}
          # Targets opportunity projections also work when quote collection is unavailable.
          if phase=='afternoon' and Path('data/slate_fetch.jsonl').is_file():
              step('install_nfl_inference',[sys.executable,'-m','pip','install','-r','requirements-nfl-inference.txt'])
              step('nfl_context_forecast',[sys.executable,'scripts/nfl_context_daily.py','run','--download'])
              context_receipt=Path('reports/nfl_context_daily.json')
              if context_receipt.is_file():
                  receipt['nfl_context']=json.loads(context_receipt.read_text())
          if archive.is_file():
              step('verify_forecast_identity',[sys.executable,'scripts/verify_history_invariants.py'])
          else:
              receipt['stages']['verify_forecast_identity']={'ok':False,'error':'HISTORY_SNAPSHOT_MISSING'}
          nhl=Path('reports/nhl_collection_receipt.json')
          if nhl.exists():
              try:
                  report=json.loads(nhl.read_text())
                  receipt['nhl']={k:report.get(k) for k in ('status','completed_games','player_rows','written_games','errors')}
              except (OSError,ValueError):
                  receipt['nhl']={'error':'INVALID_NHL_RECEIPT'}
          receipt['finished_at_utc']=datetime.now(timezone.utc).isoformat()
          Path('reports/daily_receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          if (phase == 'morning' and all(v.get('ok') is True
                for v in receipt['stages'].values()) and
                receipt.get('sport_coverage',{}).get('status') == 'success'):
              # Persist only after a genuinely completed settlement and
              # verified historical forecast identities, not a no-op run.
              subprocess.run([sys.executable,'scripts/morning_schedule.py','mark',
                 '--receipt','reports/daily_receipt.json',
                 '--run-id',os.environ['GITHUB_RUN_ID']],check=True)
          PY
      - name: Commit official NHL history
        if: always() && steps.gate.outputs.phase != 'skip'
        id: persist
        continue-on-error: true
        run: |
          git config user.name pickem-auditor-bot
          git config user.email pickem-auditor-bot@users.noreply.github.com
          git add data/nhl/games/ data/history_slate/ || true
          if ! git diff --cached --quiet; then
            git commit -m 'data: completed NHL histories'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No new completed NHL games'
          fi
          if [ -f data/prop_snapshots.jsonl ]; then
            bash scripts/shadow_store.sh save
          else
            echo 'No timestamped forecasts to persist'
          fi
      - name: Retrieve pinned converged NHL saves posterior (shadow-only)
        id: saves_model
        if: steps.gate.outputs.phase == 'afternoon'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          model_dir="data/private_models/nhl_saves"
          mkdir -p "$model_dir"
          gh release download "research-nhl-saves-20261029-run40993538888" \
            --repo "royalexx/pickem-auditor" \
            --dir "$model_dir" \
            --pattern "manifest.json" \
            --pattern "model_receipt.json" \
            --pattern "posterior.nc"
          (
            cd "$model_dir"
            echo "434f63a56ddecc1de316da62d58cc677cf74ed3412870ee96934e7989464db9b  manifest.json"
            echo "0b0c9998a4c521439721302d0da49f269f07ac0f2201f67149c9690c27442a75  model_receipt.json"
            echo "d64c87f8c48b735545aee291525b6f041e5320b1da931d724c4ecbbd7283adc9  posterior.nc"
          ) | (cd "$model_dir" && sha256sum --check --status)
          echo "SAVES_PINNED_RELEASE_VERIFIED"
      - name: Score NHL saves with frozen Bayesian posterior (shadow-only)
        if: steps.gate.outputs.phase == 'afternoon'
        continue-on-error: true
        env:
          MODEL_AVAILABLE: ${{ steps.saves_model.outcome }}
        run: |
          set -euo pipefail
          day="$(TZ=America/Toronto date +%F)"
          mkdir -p reports data/nhl_joint_saves_shadow
          if [ "$MODEL_AVAILABLE" != 'success' ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          Path('reports/nhl_joint_saves_shadow_receipt.json').write_text(
              json.dumps({'schema':'nhl_saves_joint_posterior_daily_shadow_v1',
                          'status':'unavailable','reason':'MODEL_RELEASE_NOT_VERIFIED',
                          'publication_eligible':False,'ranking_allowed':False,
                          'production_snapshot_unchanged':True})+'\n')
          PY
            echo "NHL_SAVES_SHADOW_UNAVAILABLE release download or SHA-256 verification failed"
            exit 0
          fi
          if [ ! -s data/prop_snapshots.jsonl ]; then
            echo '{"status":"unavailable","reason":"SNAPSHOTS_NOT_AVAILABLE","publication_eligible":false,"ranking_allowed":false}' > reports/nhl_joint_saves_shadow_receipt.json
            exit 0
          fi
          python -m pip install -r requirements-joint-bayes.txt
          python scripts/nhl_saves_posterior_shadow.py \
            --snapshots data/prop_snapshots.jsonl \
            --model-dir data/private_models/nhl_saves \
            --date "$day" \
            --out "data/nhl_joint_saves_shadow/$day.jsonl" \
            --receipt reports/nhl_joint_saves_shadow_receipt.json
      - name: Upload collection receipt
        if: always() && steps.gate.outputs.phase != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: pickem-daily-receipt
          path: |
            reports/daily_receipt.json
            reports/nhl_collection_receipt.json
            reports/sport_coverage.json
            reports/market_coverage.json
            reports/history_bootstrap.json
            reports/forecast_invariants.json
            reports/afternoon_audit.json
            reports/bayesian_a_shadow_receipt.json
            reports/bayesian_b_shadow_receipt.json
            reports/posterior_mc_receipt.json
            reports/posterior_mc_audit.json
            reports/nhl_joint_saves_shadow_receipt.json
            data/nhl_joint_saves_shadow/
            reports/phase4_validation.json
            data/nfl_context/
            reports/nfl_context_daily.json
            reports/nfl_context_settled.json
            data/posterior_mc/
            data/bayesian_b_shadow/
            data/bayesian_shadow/
            reports/structured_research.json
            reports/research_triage.json
            reports/pick_verification.json
            reports/review_template.json
            reports/autonomous_investigation.json
            reports/verified_board.json
            reports/research_ranked_board.json
            reports/conditional_tier3_board.json
            reports/recent_lineup_collection.json
            data/verification/
            data/research_*.json
            data/odds_quotes.jsonl
            data/slate_fetch.jsonl
            logs/snapshot_*.log
            reports/stages/*.log
            data/slate_fetch.meta.json
            data/slate_fetch.jsonl.meta.json
            data/slate_fetch.jsonl.failed.json
          retention-days: 90
          if-no-files-found: warn
      - name: Fail incomplete run visibly
        if: always() && steps.gate.outputs.phase != 'skip'
        env:
          PERSISTENCE: ${{ steps.persist.outcome }}
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          p=Path('reports/daily_receipt.json')
          if not p.exists():
              print('NO_RUN_RECEIPT');sys.exit(2)
          result=json.loads(p.read_text())
          failed=[k for k,v in result['stages'].items() if not v.get('ok')]
          if os.environ.get('PERSISTENCE')!='success':failed.append('history_persistence')
          print('Unfinished stages:',failed)
          sys.exit(2 if failed else 0)
          PY


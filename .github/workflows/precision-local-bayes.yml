name: Precision Windows laptop - joint Bayesian training (research only)
on:
  workflow_dispatch:
    inputs:
      sport:
        description: Sport with source-owned historical population
        required: true
        type: choice
        options: [NHL, NBA, NFL]
      stat:
        description: Exact warehouse stat (e.g. shots on goal, rebounds, tackles + assists)
        required: true
        type: string
      mode:
        description: Evaluate chronological holdout, or freeze full pregame posterior
        required: true
        default: holdout
        type: choice
        options: [holdout, pregame_fit]
      train_from:
        description: Inclusive first training date (NFL typically 2023-09-01)
        required: true
        default: '2023-10-01'
        type: string
      cutoff:
        description: Exclusive training cutoff, YYYY-MM-DD
        required: true
        default: '2026-09-01'
        type: string
      holdout_until:
        description: Exclusive heldout end, ignored for pregame_fit
        required: true
        default: '2026-10-29'
        type: string
      line:
        description: Fixed research line for holdout (not a bookmaker quote)
        required: true
        default: '2.5'
        type: string
      max_per_position:
        description: Training-only players per position (15 pilot; 0 all players)
        required: true
        default: '15'
        type: string

permissions:
  contents: read
concurrency:
  group: precision-joint-bayes-one-at-a-time
  cancel-in-progress: false

jobs:
  fit-and-evaluate:
    # Native Windows 11: NO Ubuntu, WSL2 or Linux runner required.
    # This job only executes on the user's explicitly registered laptop.
    runs-on: [self-hosted, Windows, X64, pickem-trainer]
    timeout-minutes: 2880
    env:
      SPORT: ${{ inputs.sport }}
      STAT: ${{ inputs.stat }}
      MODE: ${{ inputs.mode }}
      TRAIN_FROM: ${{ inputs.train_from }}
      CUTOFF: ${{ inputs.cutoff }}
      HOLDOUT_UNTIL: ${{ inputs.holdout_until }}
      LINE: ${{ inputs.line }}
      MAX_PER_POSITION: ${{ inputs.max_per_position }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Needed only for authenticated read-only fetch from private history branch.
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect Windows CPU and RAM
        run: |
          $ErrorActionPreference = 'Stop'
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-Table
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,FreePhysicalMemory,TotalVisibleMemorySize | Format-List
          python --version
          git --version
          Write-Host 'PyMC CPU sampler: NVIDIA GPU not used by the current research fit.'
      - name: Pull source-owned historical database from private GitHub
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/history_warehouse_load.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned joint Bayesian dependencies into isolated Windows venv
        run: |
          $ErrorActionPreference = 'Stop'
          $venv = Join-Path $env:RUNNER_TEMP 'pickem-joint-env'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts\python.exe'
          & $python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install -r requirements-joint-bayes.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -c "import pymc, arviz, scipy; print('NATIVE_WINDOWS_PYMC_OK',pymc.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate source completeness, chronological window, exact market
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'pickem-joint-env\Scripts\python.exe'
          & $python scripts/precision_training_driver.py validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run four-chain CPU hierarchical Bayesian training
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'pickem-joint-env\Scripts\python.exe'
          & $python scripts/precision_training_driver.py fit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare fitted Bayesian posterior with same-cohort simple holdout
        if: inputs.mode == 'holdout'
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'pickem-joint-env\Scripts\python.exe'
          & $python scripts/precision_training_driver.py holdout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record immutable code and source SHA for cloud audit
        if: always()
        run: |
          python scripts/precision_training_driver.py provenance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload posterior, convergence, holdout and provenance to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precision-windows-bayes-${{ inputs.sport }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: reports/precision_training/${{ github.run_id }}/

name: Multi-sport Bayesian population backfill
# Automatic runs paused 2026-11-02 after compute allowance exhaustion.
# Manual dispatch remains available; no scheduled or downstream auto-launch.
on:
  workflow_dispatch:
    inputs:
      max_days:
        description: '2018-forward archive calendar days per NHL and NBA sport'
        default: '25'
        required: false
      recent_days:
        description: '2023-forward recent-season days per NHL and NBA sport'
        default: '100'
        required: false
      nfl_seasons:
        description: 'Fully completed NFL seasons per run'
        default: '3'
        required: false
permissions:
  contents: write
concurrency:
  group: independent-nhl-bayesian-history
  cancel-in-progress: false
jobs:
  independent-populations:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install NFL verified bulk source library
        run: python -m pip install 'nflreadpy==0.1.5'
      - name: Restore independently persisted source history
        run: bash scripts/history_warehouse_store.sh load
      # High priority: collect recent multi-season data first; historical
      # 2018-forward backfill must not consume the whole job budget.
      - name: Prioritize verified NHL 2023-present multi-season population
        id: nhl_recent
        continue-on-error: true
        env:
          RECENT_DAYS: ${{ inputs.recent_days || '100' }}
        run: |
          python scripts/population_backfill.py --sport NHL --stream recent \
            --max-days "$RECENT_DAYS" --max-games 700 --request-spacing 0.65
      - name: Prioritize verified NBA 2023-present multi-season population
        id: nba_recent
        continue-on-error: true
        env:
          RECENT_DAYS: ${{ inputs.recent_days || '100' }}
        run: |
          python scripts/population_backfill.py --sport NBA --stream recent \
            --max-days "$RECENT_DAYS" --max-games 700 --request-spacing 0.9
      - name: NHL skater hits/blocks and goalie saves including historic SOG
        id: nhl
        continue-on-error: true
        env:
          MAX_DAYS: ${{ inputs.max_days || '25' }}
        run: |
          python scripts/population_backfill.py --sport NHL \
            --max-days "$MAX_DAYS" --max-games 220 --request-spacing 0.65
      - name: NBA points, rebounds, assists and other counting markets
        id: nba
        continue-on-error: true
        env:
          MAX_DAYS: ${{ inputs.max_days || '25' }}
        run: |
          python scripts/population_backfill.py --sport NBA \
            --max-days "$MAX_DAYS" --max-games 220 --request-spacing 0.9
      - name: Reconcile historic ESPN made-threes without rewriting other markets
        id: nba_threes_replay
        continue-on-error: true
        run: |
          python scripts/population_repair_nba_threes.py --max-days 35
      - name: NFL complete yearly bulk history with verified offense and defense snaps
        id: nfl
        continue-on-error: true
        env:
          NFL_SEASONS: ${{ inputs.nfl_seasons || '3' }}
        run: |
          python scripts/population_backfill.py --sport NFL \
            --max-nfl-seasons "$NFL_SEASONS" --max-games 500
      - name: Persist every complete date and season even if another sport blocks
        if: always()
        run: bash scripts/history_warehouse_store.sh save
      - name: Audit actual source-complete population coverage
        if: always()
        run: python scripts/population_coverage_report.py --out reports/population_coverage.json
      - name: Upload explicit per-sport coverage receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-sport-population-coverage
          retention-days: 90
          if-no-files-found: warn
          path: |
            reports/population_coverage.json
            reports/population_nhl_receipt.json
            reports/population_nba_receipt.json
            reports/population_nhl_recent_receipt.json
            reports/population_nba_recent_receipt.json
            reports/population_nfl_receipt.json
            reports/nba_threes_replay.json
            data/bayesian_warehouse/states/*.json
      - name: Treat every blocked source as blocked and never claim complete coverage
        if: always()
        env:
          NHL_RESULT: ${{ steps.nhl.outcome }}
          NBA_RESULT: ${{ steps.nba.outcome }}
          NFL_RESULT: ${{ steps.nfl.outcome }}
          NBA_REPAIR_RESULT: ${{ steps.nba_threes_replay.outcome }}
          NHL_RECENT_RESULT: ${{ steps.nhl_recent.outcome }}
          NBA_RECENT_RESULT: ${{ steps.nba_recent.outcome }}
        run: |
          test "$NHL_RESULT" = success && test "$NBA_RESULT" = success && test "$NFL_RESULT" = success && test "$NBA_REPAIR_RESULT" = success && test "$NHL_RECENT_RESULT" = success && test "$NBA_RECENT_RESULT" = success || {
            echo "ONE_OR_MORE_POPULATION_SOURCES_BLOCKED NHL=$NHL_RESULT NBA=$NBA_RESULT NFL=$NFL_RESULT NBA3PM_REPAIR=$NBA_REPAIR_RESULT NHL_RECENT=$NHL_RECENT_RESULT NBA_RECENT=$NBA_RECENT_RESULT" >&2
            exit 2
          }

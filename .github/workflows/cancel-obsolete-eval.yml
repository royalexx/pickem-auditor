name: Cancel obsolete uncompiled evaluation run
on:
  push:
    branches: ['feature/joint-nhl-subset-validation-20261028']
    paths: ['.github/workflows/cancel-obsolete-eval.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel-obsolete:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only superseded noncompiled evaluation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl --silent --show-error --output /tmp/response.json \
            --write-out '%{http_code}' --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/royalexx/pickem-auditor/actions/runs/40727145784/cancel')
          cat /tmp/response.json
          if [ "$status" = 202 ] || [ "$status" = 409 ]; then
            echo "Obsolete uncompiled evaluation cancelled or already completed"
          else
            echo "Unexpected cancellation response $status" >&2
            exit 2
          fi

name: Force stop redundant disabled-compiler NUTS job
on:
  push:
    branches: ['feature/joint-nhl-subset-validation-20261028']
    paths: ['.github/workflows/force-stop-superseded.yml']
permissions:
  actions: write
jobs:
  stop-obsolete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl --silent --show-error --output /tmp/result --write-out '%{http_code}' \
            --request POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/royalexx/pickem-auditor/actions/runs/40727776147/force-cancel')
          echo "Force-cancel obsolete job: HTTP $code"
          test "$code" = 202 -o "$code" = 409

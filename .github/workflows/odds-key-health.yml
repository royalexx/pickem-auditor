name: PropLine API credential and quota health
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate API key and report daily request allowance (never log key)
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          secret=os.environ.get('PROPLINE_API_KEY','').strip()
          if not secret:
              print(json.dumps({'status':'PROPLINE_API_KEY_SECRET_MISSING'}))
              raise SystemExit(2)
          request=urllib.request.Request(
              'https://api.prop-line.com/v1/sports',
              headers={'X-API-Key':secret,'Accept':'application/json'})
          try:
              with urllib.request.urlopen(request,timeout=15) as resp:
                  status,headers=resp.status,resp.headers
          except urllib.error.HTTPError as exc:
              status,headers=exc.code,exc.headers
              exc.close()
          except (OSError,ValueError) as exc:
              print(json.dumps({'status':'network_error','kind':type(exc).__name__}))
              raise SystemExit(2)
          result={'http_status':status}
          for key in ('X-Daily-Limit','X-Daily-Used','X-Daily-Remaining','X-Daily-Reset'):
              v=headers.get(key)
              if v is not None and v.isdigit():
                  result[key.lower()]=int(v)
          print(json.dumps(result,sort_keys=True))
          if status!=200 or 'x-daily-remaining' not in result:
              raise SystemExit(2)
          PY

name: Validate historical NBA and NFL sources
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-historical-sports.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install feed requirements
        run: python -m pip install -r requirements.txt
      - name: Collect Sunday October 25 NBA NFL NHL slate
        run: python scripts/fetch_slate.py --date 2026-10-25 --out data/backfill/slate_fetch.jsonl
      - name: Audit source rows for each league
        run: python scripts/verify_sports.py --slate data/backfill/slate_fetch.jsonl --meta data/backfill/slate_fetch.meta.json --out reports/backfill_sport_coverage.json --slot backfill
      - name: Save verified historical rows
        if: always()
        run: |
          git config user.name pickem-auditor-bot
          git config user.email pickem-auditor-bot@users.noreply.github.com
          git add data/history_slate/ || true
          if ! git diff --cached --quiet; then
            git commit -m 'data: verify October 25 NHL NBA NFL histories'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-nba-nfl-validation
          path: |
            reports/backfill_sport_coverage.json
            data/backfill/slate_fetch.meta.json
          if-no-files-found: warn
